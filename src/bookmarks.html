<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; script-src 'self' 'unsafe-inline'">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --dim: #848484;
      --line: rgba(255, 255, 255, .18);
      --line-hover: rgba(255, 255, 255, .34);
      --line-live: rgba(255, 255, 255, .72);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    ::selection { color: #fff; background: rgba(255, 255, 255, .24); }
    /* A transparent layer over the whole window, so a click anywhere outside
       the panel closes it, as a menu would. */
    html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; color: #ededed; }
    body { user-select: none; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: -2px; }

    /* Opens like the Downloads panel, where main says (--x, --y). */
    .backdrop { position: fixed; inset: 0; }
    .panel {
      position: absolute;
      top: var(--y, 0);
      left: clamp(10px, var(--x, 0px), calc(100% - var(--width) - 10px));
      width: var(--width);
      max-height: calc(100% - var(--y, 0px) - 10px);
      overflow: hidden auto;
      scrollbar-width: none;
      border-radius: 12px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line), 0 16px 40px rgba(0, 0, 0, .4);
      transform-origin: top;
    }
    .panel[hidden] { display: none; }
    .panel:focus { outline: 0; }
    .is-open .panel { animation: menu-fade 160ms ease-out, menu-in 240ms var(--settle); }
    @keyframes menu-fade { from { opacity: 0; } }
    @keyframes menu-in { from { transform: translateY(-4px) scale(.98); } }

    .list { --width: min(280px, calc(100vw - 20px)); padding: 5px; }
    .row {
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #d6d6d6;
      font-size: 12.5px;
      letter-spacing: -.01em;
      text-align: left;
      transition: background-color 140ms ease-out, color 140ms ease-out;
    }
    .row:hover, .row:focus-visible { color: #fff; background: rgba(255, 255, 255, .07); }
    .row span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .row img { width: 14px; height: 14px; flex: 0 0 auto; border-radius: 3px; }
    .row svg { flex: 0 0 auto; color: var(--dim); }
    .row.is-target { color: #fff; background: rgba(255, 255, 255, .07); }
    .row.is-dragged { opacity: .4; }
    /* Where a dragged bookmark would land. */
    .drop-mark {
      position: absolute;
      top: 0;
      left: 10px;
      right: 10px;
      height: 2px;
      border-radius: 1px;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transform: translateY(var(--drop-y, 0));
      transition: opacity 120ms ease-out, transform 160ms var(--settle);
    }
    .drop-mark.is-on { opacity: 1; }
    .empty { margin: 0; padding: 10px; color: var(--dim); font-size: 12.5px; }

    .form { --width: min(320px, calc(100vw - 20px)); margin: 0; padding: 14px; }
    .form h1 { margin: 0 0 12px; font-size: 13px; font-weight: 500; letter-spacing: -.01em; }
    .field { display: block; margin-bottom: 10px; color: var(--dim); font-size: 12px; }
    .field[hidden] { display: none; }
    .field input, .select-trigger {
      display: block;
      width: 100%;
      height: 32px;
      margin-top: 5px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      outline: 0;
      color: #ededed;
      background: transparent;
      font: inherit;
      font-size: 13px;
      letter-spacing: -.01em;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: box-shadow 200ms ease;
    }
    .field input:hover, .select-trigger:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .field input:focus, .select.is-open .select-trigger { box-shadow: inset 0 0 0 1px var(--line-live); }
    .select-trigger:focus-visible { outline-offset: 2px; }

    /* The kit's select, for the folder. The menu stays mounted and eases
       both ways; it is fixed to the window (placed by placeMenu) so the
       panel's scrolling never cuts it off. */
    .select-trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 9px 0 10px; text-align: left; cursor: pointer; }
    .select-trigger span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .select-trigger svg { flex: 0 0 auto; color: var(--dim); transition: transform 320ms var(--settle), color 200ms ease; }
    .select.is-open .select-trigger svg { transform: rotate(180deg); color: #fff; }
    .select-menu {
      position: fixed;
      z-index: 5;
      top: var(--menu-top, 0);
      left: var(--menu-left, 0);
      width: var(--menu-width, 0);
      max-height: var(--menu-height, 220px);
      display: flex;
      flex-direction: column;
      overflow: hidden auto;
      scrollbar-width: none;
      padding: 5px;
      border-radius: 12px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line), 0 16px 40px rgba(0, 0, 0, .4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px) scale(.98);
      transform-origin: var(--menu-origin, top);
      transition: opacity 160ms ease-out, transform 240ms var(--settle), visibility 0s 240ms;
    }
    .select.is-open .select-menu { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .select-menu button {
      flex: 0 0 auto;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a8a8a8;
      font-size: 12.5px;
      letter-spacing: -.01em;
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms ease-out, color 140ms ease-out;
    }
    .select-menu button span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .select-menu button svg { flex: 0 0 auto; }
    .select-menu button:is(:hover, :focus-visible) { outline: 0; color: #fff; background: rgba(255, 255, 255, .07); }
    .select-menu button[aria-selected='true'] { color: #fff; }
    .error { margin: 0 0 10px; color: #ff8f8f; font-size: 12px; }
    .error:empty { display: none; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .button {
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -.01em;
      transition: box-shadow 200ms ease, background-color 200ms ease, transform 140ms var(--settle);
    }
    .button:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .button:active { transform: scale(.97); transition-duration: 55ms; }
    .button:focus-visible { outline-offset: 2px; }
    .button[hidden] { display: none; }
    .button.is-primary { background: #ededed; color: #0a0a0a; box-shadow: none; }
    .button.is-primary:hover { background: #fff; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop">
    <div class="panel list" id="list" role="menu" tabindex="-1" hidden></div>
    <form class="panel form" id="form" role="dialog" aria-modal="true" aria-labelledby="heading" hidden>
      <h1 id="heading"></h1>
      <label class="field">Name<input id="title" type="text" maxlength="1024" autocomplete="off" spellcheck="false"></label>
      <label class="field" id="url-field">Address<input id="url" type="text" autocomplete="off" spellcheck="false"></label>
      <div class="field" id="folder-field"><span id="folder-label">Folder</span>
        <div class="select" id="folder-select">
          <button class="select-trigger" id="folder" type="button" aria-haspopup="listbox" aria-expanded="false"
            aria-controls="folder-menu" aria-labelledby="folder-label folder-value">
            <span id="folder-value"></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div class="select-menu" id="folder-menu" role="listbox" aria-labelledby="folder-label"></div>
        </div>
      </div>
      <p class="error" id="error" role="alert"></p>
      <div class="actions">
        <button class="button" id="remove" type="button">Delete</button>
        <button class="button is-primary" type="submit">Done</button>
      </div>
    </form>
  </div>

  <template id="folder-template">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path>
    </svg>
  </template>
  <template id="check-template">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
  </template>
  <template id="globe-template">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path>
    </svg>
  </template>

  <script>
    // What main asks for (bookmarksState): a list of bookmarks, in a folder
    // or past the bar's end, or the form that edits one.
    const api = window.lit.bookmarks
    const get = (id) => document.getElementById(id)
    const [backdrop, list, form, title, url, folder, error] = ['backdrop', 'list', 'form', 'title', 'url', 'folder', 'error'].map(get)
    let view = null

    const globe = () => get('globe-template').content.cloneNode(true)
    function icon(item) {
      if (item.items) return get('folder-template').content.cloneNode(true)
      if (!item.icon) return globe()
      const img = new Image()
      img.alt = ''
      img.draggable = false
      img.onerror = () => img.replaceWith(globe())
      img.src = item.icon
      return img
    }

    function createRow(item) {
      const row = document.createElement('button')
      row.type = 'button'
      row.className = 'row'
      row.draggable = true
      row.setAttribute('role', 'menuitem')
      const name = document.createElement('span')
      name.textContent = item.title || item.url || 'Folder'
      row.append(icon(item), name)
      row.title = item.url ? [item.title, item.url].filter(Boolean).join('\n') : name.textContent
      row.dataset.id = item.id
      // A folder past the bar's end opens in place.
      row.addEventListener('click', (event) => {
        if (item.items) window.lit.listBookmarks(item.id, view.at)
        else window.lit.openBookmark(item.id, event.metaKey)
      })
      row.addEventListener('auxclick', (event) => { if (event.button === 1 && !item.items) window.lit.openBookmark(item.id, true) })
      row.addEventListener('contextmenu', (event) => { event.preventDefault(); window.lit.showBookmarkMenu(item.id, view.at) })
      row.addEventListener('dragstart', (event) => {
        dragged = item
        event.dataTransfer.effectAllowed = 'move'
        event.dataTransfer.setData('text/plain', item.url || item.title)
        row.classList.add('is-dragged')
      })
      row.addEventListener('dragend', () => { row.classList.remove('is-dragged'); endDrag() })
      return row
    }

    // Dragging reorders the list as it does the bar (see index.html).
    const dropMark = document.createElement('span')
    dropMark.className = 'drop-mark'
    dropMark.setAttribute('aria-hidden', 'true')
    let dragged = null
    // { folderId, beforeId } it would land at.
    let drop = null
    function endDrag() {
      dragged = null
      setDrop(null)
    }
    // `into` is the folder row under the pointer, if it would go in there.
    function setDrop(next, y = 0, into = null) {
      drop = next
      for (const row of list.querySelectorAll('.row')) row.classList.toggle('is-target', row === into)
      dropMark.classList.toggle('is-on', Boolean(next) && !into)
      if (next && !into) dropMark.style.setProperty('--drop-y', `${y - 1}px`)
    }
    list.addEventListener('dragover', (event) => {
      if (!dragged) return
      event.preventDefault()
      event.dataTransfer.dropEffect = 'move'
      const rows = [...list.querySelectorAll('.row')]
      for (const [i, row] of rows.entries()) {
        const box = row.getBoundingClientRect()
        const at = (event.clientY - box.top) / box.height
        const item = view.items[i]
        if (item.items && !dragged.items && at > .25 && at < .75) return setDrop({ folderId: item.id, beforeId: null }, 0, row)
        if (at < .5) return setDrop({ folderId: view.folderId, beforeId: item.id }, row.offsetTop)
      }
      setDrop({ folderId: view.folderId, beforeId: null }, rows.at(-1).offsetTop + rows.at(-1).offsetHeight)
    })
    list.addEventListener('dragleave', (event) => { if (!list.contains(event.relatedTarget)) setDrop(null) })
    list.addEventListener('drop', (event) => {
      if (!dragged) return
      event.preventDefault()
      if (drop) window.lit.moveBookmark(dragged.id, drop.folderId, drop.beforeId)
      endDrag()
    })

    function drawList(state) {
      view = state
      const focused = document.activeElement?.dataset?.id
      list.setAttribute('aria-label', state.title)
      const empty = document.createElement('p')
      empty.className = 'empty'
      empty.textContent = 'This folder is empty'
      endDrag()
      list.replaceChildren(dropMark, ...(state.items.length ? state.items.map(createRow) : [empty]))
      ;(focused && [...list.children].find((row) => row.dataset.id === focused))?.focus()
    }

    function drawForm(state) {
      get('heading').textContent = state.heading
      title.value = state.values.title
      url.value = state.values.url ?? ''
      folders = [{ id: '', title: 'Bookmark bar' }, ...state.folders.map(({ id, title }) => ({ id, title: title || 'Folder' }))]
      setMenuOpen(false)
      drawFolders(state.values.folderId ?? '')
      get('url-field').hidden = get('folder-field').hidden = state.folder
      get('remove').hidden = !state.id
      error.textContent = ''
    }

    function open(state) {
      if (!state) return
      view = state
      const isList = state.kind === 'list'
      list.hidden = !isList
      form.hidden = isList
      const panel = isList ? list : form
      document.body.style.setProperty('--x', `${state.at.x}px`)
      document.body.style.setProperty('--y', `${state.at.y}px`)
      if (isList) drawList(state)
      else drawForm(state)
      panel.scrollTop = 0
      // Each open replays the panel's keyframes.
      document.body.classList.remove('is-open')
      document.body.getBoundingClientRect()
      document.body.classList.add('is-open')
      if (isList) list.focus()
      else { title.focus(); title.setSelectionRange(0, title.value.length, 'backward') }
    }

    // The folder select: one of `folders` ({ id, title }, the bar's id
    // being ''), chosen as `folderId`. Focus lives in the menu while it is
    // open; losing it closes the menu, as Escape does.
    const [folderSelect, folderMenu, folderValue] = ['folder-select', 'folder-menu', 'folder-value'].map(get)
    let folders = []
    let folderId = ''
    function drawFolders(id) {
      folderId = folders.some((each) => each.id === id) ? id : ''
      folderValue.textContent = folders.find((each) => each.id === folderId)?.title ?? ''
      folderMenu.replaceChildren(...folders.map((each) => {
        const option = document.createElement('button')
        option.type = 'button'
        option.tabIndex = -1
        option.setAttribute('role', 'option')
        option.setAttribute('aria-selected', String(each.id === folderId))
        const name = document.createElement('span')
        name.textContent = each.title
        option.append(name)
        if (each.id === folderId) option.append(get('check-template').content.cloneNode(true))
        option.addEventListener('click', () => { drawFolders(each.id); setMenuOpen(false); folder.focus() })
        return option
      }))
    }
    // Under the trigger, or over it when only there it has room.
    function placeMenu() {
      const box = folder.getBoundingClientRect()
      const below = innerHeight - box.bottom - 16
      const above = box.top - 16
      const height = Math.min(folderMenu.scrollHeight, 220)
      const under = below >= height || below >= above
      const room = Math.max(Math.min(height, under ? below : above), 34)
      const style = document.body.style
      style.setProperty('--menu-left', `${box.left}px`)
      style.setProperty('--menu-width', `${box.width}px`)
      style.setProperty('--menu-height', `${room}px`)
      style.setProperty('--menu-top', `${under ? box.bottom + 6 : box.top - 6 - room}px`)
      style.setProperty('--menu-origin', under ? 'top' : 'bottom')
    }
    function setMenuOpen(open) {
      if (open) placeMenu()
      folderSelect.classList.toggle('is-open', open)
      folder.setAttribute('aria-expanded', String(open))
      if (open) folderMenu.querySelector('[aria-selected="true"]')?.focus()
    }
    const menuOpen = () => folderSelect.classList.contains('is-open')
    folder.addEventListener('click', () => setMenuOpen(!menuOpen()))
    folderSelect.addEventListener('focusout', (event) => { if (!folderSelect.contains(event.relatedTarget)) setMenuOpen(false) })
    folderSelect.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menuOpen()) {
        // Closes the menu only, not the panel.
        event.preventDefault()
        event.stopPropagation()
        setMenuOpen(false)
        folder.focus()
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault()
        event.stopPropagation()
        if (!menuOpen()) return setMenuOpen(true)
        const options = [...folderMenu.children]
        const at = options.indexOf(document.activeElement)
        options[(at + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length].focus()
      }
    })
    // The menu is fixed where the trigger was; the panel scrolling moves that.
    form.addEventListener('scroll', () => setMenuOpen(false))

    const close = () => api.close()
    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      const saving = view
      const { error: problem = '' } = await api.save({ title: title.value, url: url.value, folderId })
      if (view === saving) error.textContent = problem
    })
    get('remove').addEventListener('click', () => api.remove())
    backdrop.addEventListener('mousedown', (event) => { if (event.target === backdrop) close() })
    // A right-click outside closes it too, with no menu of its own.
    backdrop.addEventListener('contextmenu', (event) => { if (event.target === backdrop || event.target === list) event.preventDefault() })
    document.addEventListener('keydown', (event) => {
      // An input method's own keys (Zhuyin, Pinyin) are not for the panel.
      if (event.isComposing || event.keyCode === 229) return
      if (event.key === 'Escape') { event.preventDefault(); return close() }
      const rows = list.hidden ? [] : [...list.querySelectorAll('.row')]
      const at = rows.indexOf(document.activeElement)
      const target = { ArrowDown: at + 1, ArrowUp: at === -1 ? rows.length - 1 : at - 1, Home: 0, End: rows.length - 1 }[event.key]
      if (!rows.length || target === undefined) return
      event.preventDefault()
      rows[(target + rows.length) % rows.length].focus()
    })

    api.onOpen(open)
    api.onChanged(drawList)
    // The first open is sent before this page has loaded, so it asks.
    api.get().then(open)
  </script>
</body>
</html>
