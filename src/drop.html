<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Split view drop</title>
  <style>
    :root {
      --line-hover: rgba(255, 255, 255, .34);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    /* Main lays this view over the pages while a tab is dragged from the
       strip (see dragTab in main.js); it is clear but for where the tab
       would land. */
    html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; user-select: none; }
    /* Where the tab would land: one mark that glides from place to place,
       fading in and out, drawn like the active pane's ring. */
    .mark {
      position: fixed;
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
      box-shadow: inset 0 0 0 2px var(--line-hover);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease-out, left 240ms var(--settle), top 240ms var(--settle), width 240ms var(--settle), height 240ms var(--settle);
    }
    .mark.is-shown { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .mark { transition: opacity 160ms ease-out; } }
  </style>
</head>
<body>
  <div class="mark" id="mark"></div>
  <script>
    const mark = document.getElementById('mark')
    // The rect the tab would fill ({ x, y, width, height } in this view),
    // or null to hide the mark. A mark coming into sight starts where it is
    // shown, rather than gliding from where it last was.
    function draw(rect) {
      if (!rect) return mark.classList.remove('is-shown')
      const glide = mark.classList.contains('is-shown')
      if (!glide) mark.style.transitionProperty = 'opacity'
      Object.assign(mark.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.width}px`, height: `${rect.height}px` })
      if (!glide) { mark.getBoundingClientRect(); mark.style.transitionProperty = '' }
      mark.classList.add('is-shown')
    }

    // Asks main where the tab would land each time the pointer moves; an
    // answer to an older question than the last is dropped.
    let asked = 0
    let last = ''
    async function ask(event) {
      const point = { x: event.clientX, y: event.clientY }
      const key = `${point.x},${point.y}`
      if (key === last) return
      last = key
      const question = ++asked
      const rect = await window.lit.dropPreview(point)
      if (question === asked) draw(rect)
    }
    function clear() {
      asked++
      last = ''
      draw(null)
    }
    // Taking the drag is what lets it drop here instead of on a page.
    for (const type of ['dragenter', 'dragover']) {
      document.addEventListener(type, (event) => {
        event.preventDefault()
        event.dataTransfer.dropEffect = 'move'
        ask(event)
      })
    }
    document.addEventListener('dragleave', (event) => { if (!event.relatedTarget) clear() })
    document.addEventListener('drop', (event) => {
      event.preventDefault()
      window.lit.dropTab({ x: event.clientX, y: event.clientY })
      clear()
    })
    window.lit.onDropClear(clear)
    // A pointer moving or pressing here with no drag going on means the
    // drag ended without the strip hearing of it; this view would only be
    // in the way of the pages, so it goes.
    for (const type of ['mousemove', 'mousedown', 'wheel']) document.addEventListener(type, () => window.lit.dropTab(null))
  </script>
</body>
</html>
