<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- img-src allows the pages' favicons, which load from anywhere. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: http: data:; script-src 'self' 'unsafe-inline'">
  <title>Lit</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --dim: #848484;
      --line: rgba(255, 255, 255, .18);
      --line-hover: rgba(255, 255, 255, .34);
      --line-live: rgba(255, 255, 255, .72);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #090909; overflow: hidden; user-select: none; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: -2px; }

    /* The tab strip is the window's title bar, so it drags the window.
       Its height matches STRIP_HEIGHT in main.js; 80px clears the macOS
       window buttons. */
    .strip {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px 0 80px;
      -webkit-app-region: drag;
    }
    /* Tabs shrink to their icons, then scroll sideways (without a bar),
       fading at an end with more past it (see fadeTabs). */
    .tabs {
      position: relative;
      display: flex;
      gap: 2px;
      min-width: 0;
      flex: 0 1 auto;
      overflow: auto hidden;
      scrollbar-width: none;
      scroll-padding-inline: 28px;
      mask-image: linear-gradient(to right, transparent, #000 var(--fade-left, 0px), #000 calc(100% - var(--fade-right, 0px)), transparent);
    }

    /* One thumb slides to the active tab instead of each tab fading its own fill. */
    .tab-thumb {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: var(--thumb-width, 0);
      border-radius: 8px;
      background: #1a1a1a;
      transform: translateX(var(--thumb-x, 0));
      pointer-events: none;
    }
    .tabs.is-ready .tab-thumb {
      transition: transform 320ms var(--settle), width 320ms var(--settle);
    }

    .tab {
      position: relative;
      z-index: 1;
      /* An explicit width, because size containment ignores the content's. */
      width: 200px;
      flex: 0 1 auto;
      min-width: 40px;
      height: 28px;
      container-type: inline-size;
      transition: opacity 160ms ease-out;
      -webkit-app-region: no-drag;
    }
    .tab-select {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 28px 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #8a8a8a;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -.01em;
      text-align: left;
      transition: color 260ms ease;
    }
    .tab:not(.is-active):hover .tab-select { color: #e6e6e6; }
    .tab.is-active .tab-select { color: #ededed; }
    /* A tab being dragged, and the edge of the one it would land at. */
    .tab.is-dragged { opacity: .4; }
    .tab::before, .tab::after {
      content: '';
      position: absolute;
      z-index: 2;
      top: 4px;
      bottom: 4px;
      width: 2px;
      border-radius: 1px;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease-out;
    }
    .tab::before { left: 0; }
    .tab::after { right: 0; }
    .tab.drop-before::before, .tab.drop-after::after { opacity: 1; }
    .tab-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .tab-icon { width: 14px; height: 14px; flex: 0 0 auto; display: grid; place-items: center; }
    .tab-icon img { width: 14px; height: 14px; border-radius: 3px; }
    .tab-icon svg { color: var(--dim); }
    /* The kit's spinner, at favicon size, while the page loads. */
    .spinner { position: relative; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
    .spinner::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1.5px solid transparent;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* The kit's quiet icon button, shown on the active or hovered tab. */
    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #bdbdbd;
      box-shadow: inset 0 0 0 1px transparent;
      transition:
        color 180ms ease-out,
        background-color 200ms ease,
        box-shadow 200ms ease,
        opacity 160ms ease-out,
        transform 140ms var(--settle);
      -webkit-app-region: no-drag;
    }
    .icon-button:hover { color: #fff; box-shadow: inset 0 0 0 1px var(--line-hover); }
    .icon-button:active { transform: scale(.94); }
    .tab-close {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      opacity: 0;
    }
    .tab.is-active .tab-close,
    .tab:hover .tab-close,
    .tab-close:focus-visible { opacity: 1; }
    /* The speaker of a tab that plays sound or is muted, left of its close
       button. Its waves and its cross trade places as it is muted. */
    .tab-audio {
      position: absolute;
      top: 4px;
      right: 26px;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      animation: profile-in 200ms var(--settle);
    }
    .tab-audio[hidden] { display: none; }
    .tab.has-audio .tab-select { padding-right: 50px; }
    .tab-audio path { transition: opacity 180ms ease-out, transform 240ms var(--settle); transform-origin: 18px 12px; }
    .tab-audio:not(.is-muted) .cross,
    .tab-audio.is-muted .wave { opacity: 0; transform: scale(.5); }
    .new-tab,
    .open-downloads,
    .open-profile,
    .open-settings { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; }
    .open-downloads { margin-left: auto; }

    /* The window's profile, shown once there is more than one. */
    .open-profile[hidden] { display: none; }
    .open-profile { animation: profile-in 200ms var(--settle); }
    @keyframes profile-in { from { opacity: 0; transform: scale(.8); } }
    .profile-mark {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--profile, #b4b4b4);
      color: #0a0a0a;
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      transition: background-color 200ms ease;
    }

    /* Downloads: shown once this session has any. While some are on their
       way, a ring around the arrow fills with their progress, or spins
       while a size is unknown. Stays mounted and eases in and out like
       the zoom button. */
    .open-downloads.is-hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(.8);
      transition:
        color 180ms ease-out,
        box-shadow 200ms ease,
        opacity 160ms ease-out,
        transform 200ms var(--settle),
        visibility 0s linear 200ms;
    }
    .open-downloads > svg { grid-area: 1 / 1; }
    .downloads-ring { opacity: 0; transform: rotate(-90deg); transition: opacity 200ms ease; }
    .downloads-ring circle { fill: none; stroke-width: 1.5; }
    .downloads-ring .ring-track { stroke: var(--line); }
    .downloads-ring .ring-fill {
      stroke: #fff;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: var(--left, 100);
      transition: stroke-dashoffset 320ms var(--settle);
    }
    .downloads-arrow { transition: transform 240ms var(--settle); }
    .open-downloads.is-active .downloads-ring { opacity: 1; }
    .open-downloads.is-active .downloads-arrow { transform: scale(.75); }
    /* An unknown size: a quarter of the ring turns, like the spinner. */
    .open-downloads.is-spinning .downloads-ring { animation: ring-spin 800ms linear infinite; }
    .open-downloads.is-spinning .ring-fill { stroke-dashoffset: 75; }
    @keyframes ring-spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }

    /* Narrow tabs keep just the icon; the active one keeps its close button. */
    @container (max-width: 72px) {
      .tab-select,
      .tab.has-audio .tab-select { justify-content: center; padding: 0; }
      .tab-title { display: none; }
      .tab:not(.is-active) .tab-close { display: none; }
      .tab.is-active .tab-icon { display: none; }
      /* The speaker takes the icon's place, only to look at, so clicking the
         tab still switches to it. On the active tab it sits by the close button. */
      .tab.has-audio .tab-icon { display: none; }
      .tab-audio { left: 50%; right: auto; margin-left: -10px; }
      .tab:not(.is-active) .tab-audio { pointer-events: none; }
      .tab.is-active .tab-audio { margin-left: -20px; }
      .tab.is-active.has-audio .tab-close { margin-left: 10px; }
      .tab.is-active .tab-close { left: 50%; right: auto; transform: translateX(-50%); }
      .tab.is-active .tab-close:active { transform: translateX(-50%) scale(.94); }
    }

    /* The address row. With the strip, it matches BAR_HEIGHT in main.js. */
    .bar {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px 4px;
    }

    .address { position: relative; flex: 1; min-width: 0; margin: 0; }
    .address input {
      width: 100%;
      height: 32px;
      padding: 0 14px 0 36px;
      border: 0;
      border-radius: 8px;
      outline: 0;
      color: #ededed;
      background: transparent;
      font: inherit;
      font-size: 13px;
      letter-spacing: -.01em;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: box-shadow 200ms ease, padding 200ms var(--settle);
    }
    .address input::placeholder { color: var(--dim); }
    .address input:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .address input:focus { box-shadow: inset 0 0 0 1px var(--line-live); }
    .address svg {
      position: absolute;
      top: 50%;
      left: 13px;
      color: var(--dim);
      transform: translateY(-50%);
      pointer-events: none;
      transition: color 200ms ease;
    }
    .address:focus-within svg { color: #fff; }
    /* Room for the star, and for the zoom button while it shows. */
    .address.has-star input { padding-right: 38px; }
    .address.is-zoomed input { padding-right: 92px; }

    /* Bookmarks the page, filled once it is. Shown on pages that can be. */
    .star {
      position: absolute;
      top: 50%;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-50%) scale(.8);
    }
    .address.has-star .star { opacity: 1; visibility: visible; transform: translateY(-50%); }
    .address.has-star .star:active { transform: translateY(-50%) scale(.94); }
    .address .star svg { position: static; color: inherit; transform: none; fill: transparent; transition: fill 200ms ease, transform 240ms var(--settle); }
    .star.is-on { color: #fff; }
    .address .star.is-on svg { fill: currentColor; transform: scale(1.06); }

    /* Quick search: a typed shortcut (!yt) becomes a chip naming its site
       at the start of the field, and what follows searches that site.
       Stays mounted and eases in and out like the zoom button; the field's
       text makes room for it (--chip-width is measured in the script). */
    .chip {
      position: absolute;
      top: 50%;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 8px 0 6px;
      border-radius: 6px;
      color: #ededed;
      background: rgba(255, 255, 255, .08);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -.01em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-50%) scale(.8);
      transform-origin: left center;
      transition: opacity 160ms ease-out, transform 200ms var(--settle), visibility 0s linear 200ms;
    }
    .chip img { width: 14px; height: 14px; object-fit: contain; }
    .address.has-chip .chip { opacity: 1; visibility: visible; transform: translateY(-50%); transition-delay: 0s; }
    .address.has-chip input { padding-left: calc(38px + var(--chip-width, 0px)); }

    /* The page's zoom, shown at the right of the address field when it is
       not the default; clicking resets it. Stays mounted and eases in and
       out like the kit's search clear button. */
    .zoom {
      position: absolute;
      top: 50%;
      right: 33px;
      height: 22px;
      padding: 0 7px;
      border-radius: 6px;
      color: #bdbdbd;
      font-size: 11.5px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-50%) scale(.8);
      transition:
        color 180ms ease-out,
        box-shadow 200ms ease,
        opacity 160ms ease-out,
        transform 200ms var(--settle),
        visibility 0s linear 200ms;
    }
    .address.is-zoomed .zoom { opacity: 1; visibility: visible; transform: translateY(-50%); transition-delay: 0s; }
    .address.is-zoomed .zoom:active { transform: translateY(-50%) scale(.94); }

    /* Home: a tab that has not loaded anything shows the address as a
       centered search box (the kit's search field) filling the window. */
    .home .bar { height: calc(100vh - 38px); justify-content: center; padding: 0 16px 38px; }
    .home .address { flex: 0 1 560px; }
    .home .address input { height: 48px; padding: 0 16px 0 42px; border-radius: 10px; }
    .home .address svg { left: 16px; width: 15px; height: 15px; }
    .home .chip { left: 38px; height: 28px; gap: 7px; padding: 0 10px 0 8px; border-radius: 7px; font-size: 13px; }
    .home .chip img { width: 16px; height: 16px; }
    .home .address.has-chip input { padding-left: calc(46px + var(--chip-width, 0px)); }

    /* Find in page: a field at the end of the address row, shown while the
       active tab has its find open. It slides in; closing just hides it. */
    .find {
      display: none;
      flex: 0 1 300px;
      min-width: 220px;
      height: 32px;
      margin-left: 8px;
      align-items: center;
      gap: 2px;
      padding-right: 4px;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: box-shadow 200ms ease;
    }
    .find.is-open { display: flex; animation: find-in 240ms var(--settle); }
    .find:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .find:focus-within { box-shadow: inset 0 0 0 1px var(--line-live); }
    .home .find { display: none; }
    @keyframes find-in { from { opacity: 0; transform: translateX(8px); } }
    .find input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 4px 0 12px;
      border: 0;
      outline: 0;
      color: #ededed;
      background: transparent;
      font: inherit;
      font-size: 13px;
      letter-spacing: -.01em;
    }
    .find input::placeholder { color: var(--dim); }
    .find-count {
      flex: 0 0 auto;
      padding: 0 6px;
      color: var(--dim);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .find-count:empty { display: none; }
    .find .icon-button { width: 24px; height: 24px; flex: 0 0 auto; border-radius: 6px; }
    .find .icon-button:disabled { opacity: .4; pointer-events: none; }

    /* The bookmark bar: a row under the address row (over the home search
       box, at its top). Its height matches BOOKMARKS_HEIGHT in main.js. What
       doesn't fit is listed by the button at its end. */
    .bookmarks { display: none; height: 34px; align-items: center; gap: 2px; padding: 0 10px 6px; }
    .bookmarks.is-open { display: flex; }
    .home .bookmarks { position: absolute; top: 38px; left: 0; right: 0; z-index: 1; }
    .bookmark-list { position: relative; flex: 1; min-width: 0; height: 28px; display: flex; gap: 2px; overflow: hidden; }
    .bookmark {
      position: relative;
      flex: 0 0 auto;
      max-width: 160px;
      height: 28px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a8a8a8;
      font-size: 12px;
      letter-spacing: -.01em;
      transition: color 180ms ease-out, background-color 180ms ease-out, opacity 160ms ease-out, transform 140ms var(--settle);
    }
    .bookmark:hover, .bookmark.is-target { color: #fff; background: rgba(255, 255, 255, .07); }
    .bookmark:active { transform: scale(.98); }
    .bookmark.is-dragged { opacity: .4; }
    .bookmark.is-over { visibility: hidden; }
    .bookmark > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .bookmark img { width: 14px; height: 14px; flex: 0 0 auto; border-radius: 3px; }
    .bookmark svg { flex: 0 0 auto; color: var(--dim); }
    .bookmark.is-icon-only > span { display: none; }
    /* Where a dragged bookmark would land. */
    .drop-mark {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      width: 2px;
      border-radius: 1px;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transform: translateX(var(--drop-x, 0));
      transition: opacity 120ms ease-out, transform 160ms var(--settle);
    }
    .drop-mark.is-on { opacity: 1; }
    .bookmark-hint { align-self: center; padding: 0 4px; overflow: hidden; color: var(--dim); font-size: 12px; letter-spacing: -.01em; white-space: nowrap; text-overflow: ellipsis; }
    .more-bookmarks { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; }
    .more-bookmarks[hidden] { display: none; }

    /* A site's permission request: a row under the address row while the
       active tab asks. Its height matches PROMPT_HEIGHT in main.js, which
       moves the page down by it. */
    .prompt { display: none; height: 44px; padding: 0 12px 8px; }
    .prompt.is-open { display: block; }
    .prompt-box {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px 0 12px;
      border-radius: 10px;
      background: #141414;
      box-shadow: inset 0 0 0 1px var(--line);
      animation: prompt-in 240ms var(--settle);
    }
    @keyframes prompt-in { from { opacity: 0; transform: translateY(-4px); } }
    .prompt-box > svg { flex: 0 0 auto; color: var(--dim); }
    /* A long site name shortens itself from the start, keeping the end of
       its name (the domain and port that matter). Side by side, what it
       wants is never cut: the site takes the room left. In a narrow window
       the two stack, each with the row's full width. */
    .prompt-text {
      flex: 1;
      min-width: 0;
      display: flex;
      overflow: hidden;
      color: #bdbdbd;
      font-size: 12.5px;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .prompt-text strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; direction: rtl; color: #ededed; font-weight: 500; }
    /* Only an app's link can be named at such length that it would take the
       site's room too; it is cut, and the row's tooltip has it whole. */
    .prompt-text span { flex: none; max-width: 70%; margin-left: .3em; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 720px) {
      .prompt-text { flex-direction: column; justify-content: center; font-size: 12px; line-height: 15px; }
      .prompt-text strong { align-self: flex-start; max-width: 100%; }
      .prompt-text span { max-width: 100%; margin-left: 0; }
    }
    .home .prompt { display: none; }
    /* The kit's buttons, small: outline for Block, solid for Allow. */
    .prompt-button {
      flex: 0 0 auto;
      height: 26px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -.01em;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: box-shadow 200ms ease, background-color 200ms ease, transform 140ms var(--settle);
    }
    .prompt-button:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .prompt-button:active { transform: scale(.97); transition-duration: 55ms; }
    .prompt-button.is-primary { background: #ededed; color: #0a0a0a; box-shadow: none; }
    .prompt-button.is-primary:hover { background: #fff; }
    .prompt .icon-button { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 7px; }

    /* A server or proxy asking for a username and password: a row in the
       prompt's place. Its height matches SIGN_IN_HEIGHT in main.js, and
       SIGN_IN_NOTE more with a note. */
    .sign-in { display: none; height: 88px; padding: 0 12px 8px; }
    .sign-in.is-open { display: block; }
    .sign-in.has-note { height: 106px; }
    .home .sign-in { display: none; }
    .sign-in-box {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      padding: 0 8px 0 12px;
      border-radius: 10px;
      background: #141414;
      box-shadow: inset 0 0 0 1px var(--line);
      animation: prompt-in 240ms var(--settle);
    }
    .private .sign-in-box { background: #15111f; }
    .sign-in-about { display: flex; align-items: flex-start; gap: 10px; }
    .sign-in-about > svg { flex: 0 0 auto; margin-top: 1px; color: var(--dim); }
    .sign-in-about > div { flex: 1; min-width: 0; }
    .sign-in .prompt-text { flex-direction: row; justify-content: flex-start; font-size: 12.5px; line-height: 16px; }
    .sign-in .prompt-text strong { align-self: auto; }
    .sign-in .prompt-text span { margin-left: .3em; }
    .sign-in-note { height: 16px; margin-top: 2px; overflow: hidden; color: #f0b866; font-size: 12px; line-height: 16px; letter-spacing: -.01em; white-space: nowrap; text-overflow: ellipsis; }
    .sign-in-note:empty { display: none; }
    .sign-in-fields { display: flex; align-items: center; gap: 8px; }
    .sign-in-fields input {
      flex: 1;
      min-width: 0;
      max-width: 260px;
      height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      outline: 0;
      color: #ededed;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
      font: inherit;
      font-size: 13px;
      letter-spacing: -.01em;
      transition: box-shadow 200ms ease;
    }
    .sign-in-fields input::placeholder { color: var(--dim); }
    .sign-in-fields input:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .sign-in-fields input:focus { box-shadow: inset 0 0 0 1px var(--line-live); }
    .sign-in-fields .prompt-button { height: 30px; }
    .sign-in-fields .prompt-button:first-of-type { margin-left: auto; }

    /* The page shown in place of one that failed or crashed, as the kit's
       empty state: the rest of the window, under the rows above. */
    .error { display: none; }
    .failed { display: flex; flex-direction: column; height: 100vh; }
    .failed > * { flex-shrink: 0; }
    .failed .error { flex: 1; min-height: 0; display: flex; overflow: auto; outline: 0; }
    .error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      margin: auto;
      padding: 32px 24px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .error h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -.01em; color: #fff; }
    .error p { max-width: 44ch; margin: 0; color: #a0a0a0; font-size: 13px; line-height: 1.7; text-wrap: pretty; user-select: text; }
    .error code { margin-top: 6px; color: var(--dim); font: 400 11px/1.5 'DM Mono', ui-monospace, monospace; user-select: text; }
    .error-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
    /* The kit's outline button, small. */
    .outline-button {
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.01em;
      transition: box-shadow 200ms ease, transform 140ms var(--settle);
    }
    .outline-button:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .outline-button:active { transform: scale(.97); transition-duration: 55ms; }

    /* A private window (?private in its address, from main) is a shade of
       violet instead of grey, with a Private badge in the strip and a note
       under the home search box. Its background matches the window's in
       main.js. */
    .private {
      --line: rgba(196, 181, 253, .2);
      --line-hover: rgba(196, 181, 253, .38);
      --line-live: rgba(221, 214, 254, .75);
      --dim: #8b84a0;
      background: #0c0a12;
    }
    .private .tab-thumb { background: #1c1729; }
    .private .prompt-box { background: #15111f; }
    .private-badge {
      display: none;
      align-items: center;
      gap: 6px;
      height: 24px;
      margin-left: auto;
      padding: 0 10px 0 8px;
      border-radius: 999px;
      color: #c4b5fd;
      background: rgba(167, 139, 250, .12);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .private .private-badge { display: flex; }
    .private .open-downloads { margin-left: 0; }
    .private-note {
      display: none;
      position: absolute;
      top: calc(100% + 14px);
      left: 0;
      right: 0;
      margin: 0;
      color: var(--dim);
      font-size: 12.5px;
      line-height: 1.5;
      text-align: center;
      text-wrap: balance;
    }
    .home.private .private-note { display: block; animation: find-in 240ms var(--settle); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body class="home">

  <template id="folder-template">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path>

  <script>
    // A private window says so in its address (see createWindow in main.js).
    const isPrivate = new URLSearchParams(location.search).has('private')
    const homeLabel = isPrivate ? 'Search privately or enter address' : 'Search or enter address'
    if (isPrivate) {
      document.body.classList.add('private')
      document.getElementById('address').placeholder = homeLabel
      document.getElementById('address').setAttribute('aria-label', homeLabel)
    }
    const addressForm = document.getElementById('address-form')
    const address = document.getElementById('address')
    const zoomButton = document.getElementById('zoom')
    const downloadsButton = document.getElementById('open-downloads')
    const findBox = document.getElementById('find')
    const findInput = document.getElementById('find-input')
    const findCount = document.getElementById('find-count')
    const findPrevious = document.getElementById('find-previous')
    const findNext = document.getElementById('find-next')
    const tabList = document.getElementById('tabs')
    const thumb = document.getElementById('thumb')
    const tabTemplate = document.getElementById('tab-template')
    const globeTemplate = document.getElementById('globe-template')

    // The main process owns the tabs; this draws its latest state.
    let state = { activeId: null, tabs: [] }
    // Tab id -> its elements, kept so favicons and hover states survive updates.
    const tabElements = new Map()

    const activeTab = () => state.tabs.find((tab) => tab.id === state.activeId)
    const currentUrl = () => (activeTab()?.started ? activeTab().url : '')
    // True while the address field holds text the user typed and has not sent.
    let editing = false
    // The page address the field last followed.
    let shownUrl = ''
    const tabLabel = (tab) => tab.title || (tab.started ? tab.url.replace(/^https?:\/\/(www\.)?/, '') : '') || 'New Tab'

    // Tooltips end with the button's current shortcut, from Settings.
    let shortcutLabels = {}
    function labelShortcut(button) {
      button.dataset.name ??= button.title
      const shortcut = shortcutLabels[button.dataset.shortcut]
      button.title = shortcut ? `${button.dataset.name} (${shortcut})` : button.dataset.name
    }

    function createTab(id) {
      const root = tabTemplate.content.firstElementChild.cloneNode(true)
      const select = root.querySelector('.tab-select')
      const audio = root.querySelector('.tab-audio')
      const close = root.querySelector('.tab-close')
      select.addEventListener('click', () => window.lit.activateTab(id))
      close.addEventListener('click', () => window.lit.closeTab(id))
      // Middle click closes, as in other browsers.
      root.addEventListener('auxclick', (event) => { if (event.button === 1) window.lit.closeTab(id) })
      // Main shows the tab's menu; preventing the default keeps the
      // toolbar's own text menu from showing too.
      root.addEventListener('contextmenu', (event) => { event.preventDefault(); window.lit.showTabMenu(id) })
      root.draggable = true
      root.addEventListener('dragstart', (event) => {
        draggedTab = id
        event.dataTransfer.effectAllowed = 'move'
        // A type of Lit's own, so a page or a field it is dropped on gets nothing.
        event.dataTransfer.setData('application/x-lit-tab', String(id))
        root.classList.add('is-dragged')
      })
      // The press of a drag takes focus, so it goes back to the toolbar's
      // control that had it, or else the page (or its search box).
      root.addEventListener('pointerdown', () => { pressedFrom = document.hasFocus() && performance.now() - focusedAt > 100 ? document.activeElement : null })
      root.addEventListener('dragend', () => {
        endTabDrag()
        if (pressedFrom?.isConnected && pressedFrom !== document.body) pressedFrom.focus({ preventScroll: true })
        else window.lit.focusActive()
      })
      labelShortcut(close)
      // Like the rest of the strip, a mouse click leaves focus with the page;
      // Enter and Space keep it here.
      audio.addEventListener('mousedown', (event) => event.preventDefault())
      audio.addEventListener('click', (event) => {
        window.lit.toggleMute(id)
        if (event.detail) window.lit.focusPage(state.activeId)
      })
      const elements = { root, select, audio, close, icon: root.querySelector('.tab-icon'), title: root.querySelector('.tab-title'), iconKey: null }
      tabElements.set(id, elements)
      return elements
    }

    // A spinner while loading, then the favicon, or a globe without one.
    function drawIcon(elements, tab) {
      const key = tab.loading ? 'loading' : tab.favicon || 'globe'
      if (elements.iconKey === key) return
      elements.iconKey = key
      if (tab.loading) {
        elements.icon.innerHTML = '<span class="spinner"></span>'
      } else if (tab.favicon) {
        const img = new Image()
        img.alt = ''
        img.draggable = false
        img.src = tab.favicon
        // A favicon that fails to load falls back to the globe.
        img.onerror = () => { elements.iconKey = 'globe'; elements.icon.replaceChildren(globeTemplate.content.cloneNode(true)) }
        elements.icon.replaceChildren(img)
      } else {
        elements.icon.replaceChildren(globeTemplate.content.cloneNode(true))
      }
    }

    // The tab's speaker, named with its command's shortcut on the active
    // tab, which is the one the shortcut mutes.
    function drawAudio({ root, audio }, tab, isActive) {
      const muted = tab.audio === 'muted'
      // A focused speaker that goes away leaves focus on its tab.
      if (!tab.audio && document.activeElement === audio) root.querySelector('.tab-select').focus()
      audio.hidden = !tab.audio
      root.classList.toggle('has-audio', Boolean(tab.audio))
      // Keeps its icon as it was while silent.
      if (!tab.audio) return
      audio.classList.toggle('is-muted', muted)
      const name = muted ? 'Unmute Tab' : 'Mute Tab'
      const shortcut = isActive && shortcutLabels['shortcuts.muteTab']
      audio.title = shortcut ? `${name} (${shortcut})` : name
      audio.setAttribute('aria-label', muted ? 'Unmute tab' : 'Mute tab')
      audio.tabIndex = isActive ? 0 : -1
    }

    function render(next) {
      const switched = next.activeId !== state.activeId
      const ids = new Set(next.tabs.map((tab) => tab.id))
      // The same tabs in another order, so one was moved.
      const reordered = next.tabs.length === state.tabs.length && state.tabs.every(({ id }) => ids.has(id)) &&
        state.tabs.some(({ id }, index) => id !== next.tabs[index].id)
      const lefts = reordered && new Map([...tabElements].map(([id, { root }]) => [id, tabLeft(root)]))
      const focused = tabList.contains(document.activeElement) ? document.activeElement : null
      state = next

      for (const [id, elements] of tabElements) {
        if (ids.has(id)) continue
        elements.root.remove()
        tabElements.delete(id)
        if (id === draggedTab) endTabDrag()
      }
      state.tabs.forEach((tab, index) => {
        const elements = tabElements.get(tab.id) || createTab(tab.id)
        // Child 0 is the thumb, so tab `index` sits at child index + 1.
        if (tabList.children[index + 1] !== elements.root) tabList.insertBefore(elements.root, tabList.children[index + 1] || null)
        const isActive = tab.id === state.activeId
        const label = tabLabel(tab)
        elements.root.classList.toggle('is-active', isActive)
        elements.select.setAttribute('aria-selected', String(isActive))
        elements.select.tabIndex = isActive ? 0 : -1
        elements.close.tabIndex = isActive ? 0 : -1
        elements.title.textContent = label
        elements.select.title = label
        // Narrow tabs hide their title text, so name the tab directly.
        elements.select.setAttribute('aria-label', tab.audio ? `${label}, ${tab.audio === 'muted' ? 'muted' : 'playing sound'}` : label)
        drawIcon(elements, tab)
        drawAudio(elements, tab, isActive)
      })
      placeThumb()
      fadeTabs()
      if (reordered) {
        for (const { glide } of tabElements.values()) glide?.cancel()
        // A tab put elsewhere in the page loses focus. The focused tab is the
        // one moved, by keys or a drag, so it stays in view.
        if (focused && document.activeElement !== focused) focused.focus({ preventScroll: true })
        focused?.closest('.tab')?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
        glideTabs(lefts)
      }
      if (refocusTabs) { refocusTabs = false; tabElements.get(state.activeId)?.select.focus() }
      if (switched) tabElements.get(state.activeId)?.root.scrollIntoView({ block: 'nearest', inline: 'nearest' })

      const tab = activeTab()
      document.body.classList.toggle('home', !tab?.started)
      // Switching tabs shows the new tab's address. Otherwise the field
      // follows the page's address when it changes, unless the user is
      // typing; so a sent address stays until the new page commits.
      const url = currentUrl()
      if (switched) { editing = false; closeSuggestions(); setChip(null) }
      if (switched || (!editing && url !== shownUrl)) address.value = url
      shownUrl = url
      measureChip()

      // The zoom button keeps its last text while it fades out.
      const zoom = tab?.started ? tab.zoom : ''
      address.parentElement.classList.toggle('is-zoomed', Boolean(zoom))
      zoomButton.tabIndex = zoom ? 0 : -1
      if (zoom) {
        zoomButton.textContent = zoom
        zoomButton.setAttribute('aria-label', `Zoom ${zoom}, reset zoom`)
      }
      drawStar()
      drawFind(tab?.find, switched)
      drawPrompt(tab)
      drawSignIn(tab)
      drawError(tab)
    }

    // The bookmark bar ({ visible, items } from main; see src/bookmarks.js).
    const star = document.getElementById('star')
    const bookmarkBar = document.getElementById('bookmarks')
    const bookmarkList = document.getElementById('bookmark-list')
    const moreBookmarks = document.getElementById('more-bookmarks')
    const dropMark = document.getElementById('drop-mark')
    const folderTemplate = document.getElementById('folder-template')
    let bookmarks = { visible: false, items: [] }
    // The bar's buttons, in order: { item, root }.
    let bookmarkButtons = []

    function drawStar() {
      const url = currentUrl()
      // A page asking to sign in is not there yet.
      const can = /^(https?|file):/i.test(url) && !activeTab().signIn?.main
      const on = can && bookmarks.items.some((item) => item.url === url || item.items?.some((each) => each.url === url))
      addressForm.classList.toggle('has-star', can)
      star.tabIndex = can ? 0 : -1
      star.classList.toggle('is-on', on)
      star.dataset.name = on ? 'Edit Bookmark' : 'Bookmark This Page'
      star.setAttribute('aria-label', on ? 'Edit bookmark' : 'Bookmark this page')
      labelShortcut(star)
    }
    star.addEventListener('click', () => window.lit.bookmarkPage())

    const globe = () => globeTemplate.content.cloneNode(true)
    function bookmarkIcon(item) {
      if (item.items) return folderTemplate.content.cloneNode(true)
      if (!item.icon) return globe()
      const img = new Image()
      img.alt = ''
      img.draggable = false
      img.onerror = () => img.replaceWith(globe())
      img.src = item.icon
      return img
    }
    // A list or form opens from the bar's bottom, under its button.
    const below = (element) => ({ x: element.getBoundingClientRect().left, y: bookmarkBar.getBoundingClientRect().bottom })

    function createBookmark(item) {
      const root = document.createElement('button')
      root.type = 'button'
      root.className = 'bookmark'
      root.draggable = true
      const name = item.title || (item.items ? 'Folder' : '')
      root.append(bookmarkIcon(item))
      const label = document.createElement('span')
      label.textContent = name
      root.append(label)
      root.classList.toggle('is-icon-only', !name)
      root.title = item.items ? name : [name, item.url].filter(Boolean).join('\n')
      root.setAttribute('aria-label', name || item.url)
      if (item.items) root.setAttribute('aria-haspopup', 'menu')
      root.addEventListener('click', (event) => {
        if (item.items) window.lit.listBookmarks(item.id, below(root))
        else window.lit.openBookmark(item.id, event.metaKey)
      })
      // Middle click opens a new tab, as in other browsers.
      root.addEventListener('auxclick', (event) => { if (event.button === 1 && !item.items) window.lit.openBookmark(item.id, true) })
      root.addEventListener('contextmenu', (event) => {
        event.preventDefault()
        event.stopPropagation()
        window.lit.showBookmarkMenu(item.id, below(root))
      })
      root.addEventListener('dragstart', (event) => {
        dragged = item
        event.dataTransfer.effectAllowed = 'move'
        event.dataTransfer.setData('text/plain', item.url || name)
        root.classList.add('is-dragged')
      })
      root.addEventListener('dragend', () => { root.classList.remove('is-dragged'); endDrag() })
      return root
    }

    function drawBookmarks(next) {
      const items = JSON.stringify(next.items)
      const changed = items !== JSON.stringify(bookmarks.items) || !bookmarkList.querySelector('.bookmark, .bookmark-hint')
      bookmarks = next
      bookmarkBar.classList.toggle('is-open', next.visible)
      if (changed) {
        // Redrawn whole; focus stays on the same bookmark.
        const focused = bookmarkButtons.find(({ root }) => root === document.activeElement)?.item.id
        bookmarkButtons = next.items.map((item) => ({ item, root: createBookmark(item) }))
        const hint = document.createElement('span')
        hint.className = 'bookmark-hint'
        hint.textContent = 'Bookmark a page with the star in the address bar to keep it here'
        bookmarkList.replaceChildren(dropMark, ...(next.items.length ? bookmarkButtons.map(({ root }) => root) : [hint]))
        bookmarkButtons.find(({ item }) => item.id === focused)?.root.focus()
        endDrag()
      }
      fitBookmarks()
      drawStar()
    }

    // Hides the bookmarks past the bar's end; the button there lists them.
    const overflowing = () => bookmarkButtons.filter(({ root }) => root.classList.contains('is-over'))
    function fitBookmarks() {
      if (!bookmarks.visible) return
      const fit = () => {
        const end = bookmarkList.clientWidth
        let over = false
        for (const { root } of bookmarkButtons) {
          over ||= root.offsetLeft + root.offsetWidth > end
          root.classList.toggle('is-over', over)
        }
        return over
      }
      // The button takes room too, so it only shows when needed without it.
      moreBookmarks.hidden = true
      if (!fit()) return
      moreBookmarks.hidden = false
      fit()
    }
    window.addEventListener('resize', fitBookmarks)
    document.fonts?.ready.then(fitBookmarks)
    moreBookmarks.addEventListener('click', () => window.lit.listBookmarks(overflowing().map(({ item }) => item.id), below(moreBookmarks)))
    bookmarkBar.addEventListener('contextmenu', (event) => {
      event.preventDefault()
      window.lit.showBookmarkMenu(null, { x: event.clientX, y: bookmarkBar.getBoundingClientRect().bottom })
    })

    // Dragging a bookmark reorders the bar, or drops it on a folder's
    // middle to put it in there.
    let dragged = null
    // { folderId, beforeId } it would land at.
    let drop = null
    function endDrag() {
      dragged = null
      setDrop(null)
    }
    function setDrop(next, x = 0) {
      drop = next
      for (const { item, root } of bookmarkButtons) root.classList.toggle('is-target', Boolean(next?.folderId) && item.id === next.folderId)
      dropMark.classList.toggle('is-on', Boolean(next) && !next.folderId)
      if (next && !next.folderId) dropMark.style.setProperty('--drop-x', `${x}px`)
    }
    bookmarkList.addEventListener('dragover', (event) => {
      if (!dragged) return
      event.preventDefault()
      event.dataTransfer.dropEffect = 'move'
      const shown = bookmarkButtons.filter(({ root }) => !root.classList.contains('is-over'))
      const left = bookmarkList.getBoundingClientRect().left
      for (const { item, root } of shown) {
        const box = root.getBoundingClientRect()
        const at = (event.clientX - box.left) / box.width
        if (item.items && !dragged.items && at > .25 && at < .75) return setDrop({ folderId: item.id, beforeId: null })
        if (at < .5) return setDrop({ folderId: null, beforeId: item.id }, Math.max(0, box.left - left - 2))
      }
      // After the last one shown, so before the first hidden one, if any.
      const last = shown.at(-1)?.root.getBoundingClientRect()
      setDrop({ folderId: null, beforeId: overflowing()[0]?.item.id ?? null }, last ? last.right - left : 0)
    })
    bookmarkList.addEventListener('dragleave', (event) => { if (!bookmarkList.contains(event.relatedTarget)) setDrop(null) })
    bookmarkList.addEventListener('drop', (event) => {
      if (!dragged) return
      event.preventDefault()
      if (drop) window.lit.moveBookmark(dragged.id, drop.folderId, drop.beforeId)
      endDrag()
    })

    // The active tab's permission request. The row slides in for each new
    // request, and stays put while the same one is redrawn; its text
    // follows what it asks about, which a choice made elsewhere can narrow.
    const promptRow = document.getElementById('prompt')
    const promptText = document.getElementById('prompt-text')
    let shownPrompt = null
    let shownKinds = null
    function drawPrompt(tab) {
      const prompt = tab?.started ? tab.prompt : null
      const key = prompt ? `${tab.id}:${prompt.id}` : null
      // Only a change of text touches the live region, so it is read once.
      if (prompt && promptText.textContent !== `${prompt.site} wants to ${prompt.does}`) {
        // The name reads left to right inside its right-to-left box.
        const site = document.createElement('strong')
        const name = document.createElement('bdi')
        name.dir = 'ltr'
        name.textContent = prompt.site
        site.append(name)
        const does = document.createElement('span')
        does.textContent = `wants to ${prompt.does}`
        // The space is for screen readers; flex layout drops it, and the
        // margin spaces the two on screen.
        promptText.replaceChildren(site, ' ', does)
        promptRow.title = `${prompt.site} wants to ${prompt.does}`
        // The buttons name the whole site, however short the row.
        document.getElementById('prompt-allow').setAttribute('aria-label', `Allow ${prompt.site} to ${prompt.does}`)
        document.getElementById('prompt-block').setAttribute('aria-label', `Block ${prompt.site} from being able to ${prompt.does}`)
      }
      // A different request, or a change in what it asks about, takes focus
      // off the buttons, so a repeated Enter never answers it unseen.
      const shown = prompt ? `${key}:${prompt.kinds}` : null
      if (shown !== shownKinds && promptRow.contains(document.activeElement)) document.activeElement.blur()
      shownKinds = shown
      if (key === shownPrompt) return
      shownPrompt = key
      promptRow.classList.toggle('is-open', Boolean(prompt))
      if (!prompt) return
      // Replays the slide-in.
      const box = promptRow.firstElementChild
      box.style.animation = 'none'
      box.getBoundingClientRect()
      box.style.animation = ''
    }
    // A click answers the prompt that was showing when it began: the one
    // under the pointer at pointer-down, or for a key, the one shown now.
    // A prompt replaced mid-click is left unanswered.
    const promptKey = () => { const tab = activeTab(); return tab?.prompt && `${tab.id}:${tab.prompt.id}:${tab.prompt.kinds}` }
    let pressed = null
    promptRow.addEventListener('pointerdown', () => { pressed = promptKey() })
    const answerPrompt = (choice) => (event) => {
      const tab = activeTab()
      const started = event.detail === 0 ? promptKey() : pressed
      pressed = null
      if (tab?.prompt && started === promptKey()) window.lit.answerPermission(tab.id, tab.prompt.id, tab.prompt.kinds, choice)
    }
    document.getElementById('prompt-allow').addEventListener('click', answerPrompt('allow'))
    document.getElementById('prompt-block').addEventListener('click', answerPrompt('block'))
    document.getElementById('prompt-dismiss').addEventListener('click', answerPrompt(null))

    // The active tab's sign-in prompt. Another prompt empties the fields and
    // takes focus off them, so nothing typed for one is sent to the next.
    // Answered as the permission prompt is: for the one the click began on.
    const signInForm = document.getElementById('sign-in')
    const signInText = document.getElementById('sign-in-text')
    const signInNote = document.getElementById('sign-in-note')
    const username = document.getElementById('sign-in-username')
    const password = document.getElementById('sign-in-password')
    let shownSignIn = null
    let signInTab = null
    let focusSignIn = null
    function drawSignIn(tab) {
      const prompt = tab?.started ? tab.signIn : null
      if (prompt && (signInForm.title !== `${prompt.name} ${prompt.asks}` || signInNote.textContent !== prompt.note)) {
        const site = document.createElement('strong')
        const name = document.createElement('bdi')
        name.dir = 'ltr'
        name.textContent = prompt.name
        site.append(name)
        const asks = document.createElement('span')
        asks.textContent = prompt.asks
        signInText.replaceChildren(site, ' ', asks)
        signInNote.textContent = prompt.note
        signInForm.title = `${prompt.name} ${prompt.asks}`
        signInForm.setAttribute('aria-label', `Sign in to ${prompt.name}`)
      }
      const id = prompt?.id ?? null
      if (id !== shownSignIn) {
        const focused = signInForm.contains(document.activeElement)
        const sameTab = tab?.id === signInTab
        shownSignIn = id
        signInTab = prompt ? tab.id : null
        username.value = ''
        password.value = ''
        if (focused) document.activeElement.blur()
        signInForm.classList.toggle('is-open', Boolean(prompt))
        signInForm.classList.toggle('has-note', Boolean(prompt?.note))
        // The page comes back, unless it was another tab's.
        if (!prompt && focused && sameTab && document.hasFocus()) window.lit.focusPage(tab.id)
        if (prompt) {
          const box = signInForm.firstElementChild
          box.style.animation = 'none'
          box.getBoundingClientRect()
          box.style.animation = ''
        }
      }
      if (prompt && focusSignIn === id) username.focus()
      focusSignIn = null
    }
    window.lit.onFocusSignIn((id) => {
      if (id === shownSignIn) username.focus()
      else focusSignIn = id
    })
    let signInPressed = null
    signInForm.addEventListener('pointerdown', () => { signInPressed = shownSignIn })
    const answerSignIn = (credentials) => (event) => {
      event.preventDefault()
      const started = event.detail === 0 ? shownSignIn : signInPressed
      signInPressed = null
      if (shownSignIn === null || started !== shownSignIn) return
      // Enter in the username goes on to the password. Two empty fields are
      // sent only from the button itself, not by an Enter meant for something
      // else as the prompt appeared.
      const byEnter = event.detail === 0 && document.activeElement !== event.currentTarget
      if (credentials && byEnter && !password.value && document.activeElement === username) return password.focus()
      if (credentials && byEnter && !username.value && !password.value) return
      window.lit.answerSignIn(signInTab, shownSignIn, credentials ? { username: username.value, password: password.value } : null)
    }
    // Enter in a field clicks the button too.
    document.getElementById('sign-in-submit').addEventListener('click', answerSignIn(true))
    document.getElementById('sign-in-cancel').addEventListener('click', answerSignIn(false))
    signInForm.addEventListener('submit', (event) => event.preventDefault())
    signInForm.addEventListener('keydown', (event) => {
      if (event.isComposing || event.keyCode === 229) return
      if (event.key === 'Escape' && !event.repeat) { event.preventDefault(); answerSignIn(false)(new CustomEvent('cancel', { detail: 0 })) }
    })

    // The active tab's error page, in place of a page that failed. Main
    // gives it focus before it is drawn, so that waits for it; a page that
    // comes back takes the focus the error page had.
    const errorPage = document.getElementById('error')
    const errorBack = document.getElementById('error-back')
    const errorRetry = document.getElementById('error-retry')
    let errorTab = null
    let focusError = false
    function drawError(tab) {
      const error = tab?.started ? tab.error : null
      const cameBack = !error && tab && tab.id === errorTab && document.hasFocus() && errorPage.contains(document.activeElement)
      errorTab = error ? tab.id : null
      document.body.classList.toggle('failed', Boolean(error))
      if (cameBack) window.lit.focusPage(tab.id)
      if (!error) { focusError = false; return }
      document.getElementById('error-title').textContent = error.title
      document.getElementById('error-detail').textContent = error.detail
      document.getElementById('error-code').textContent = error.code
      errorRetry.textContent = error.action
      errorBack.hidden = !error.canGoBack
      if (focusError) { focusError = false; errorPage.focus() }
    }
    window.lit.onFocusError(() => {
      if (errorTab === null) focusError = true
      else errorPage.focus()
    })
    errorRetry.addEventListener('click', () => window.lit.reload(errorTab))
    errorBack.addEventListener('click', () => window.lit.goBack(errorTab))

    // The find field shows the active tab's find. Its text comes from main
    // only on opening or switching tabs; otherwise the field is the source.
    let findShown = false
    let shownFind = null
    function drawFind(find, switched) {
      if (!find && findBox.contains(document.activeElement)) document.activeElement.blur()
      findBox.classList.toggle('is-open', Boolean(find))
      if (find && (switched || !findShown)) findInput.value = find.text
      findShown = Boolean(find)
      shownFind = find
      drawFindCount()
    }

    // The count and arrows show main's answer only while it is for the text
    // now in the field, and stay blank until the page answers, so a count
    // never belongs to older text typed a moment ago.
    function drawFindCount() {
      const find = shownFind?.text === findInput.value ? shownFind : null
      findCount.textContent = !find?.text || find.matches === null ? ''
        : find.matches ? `${find.active} of ${find.matches}` : 'No matches'
      findPrevious.disabled = findNext.disabled = !find?.text || find.matches === 0
    }

    // Moves the thumb under the active tab. Window resizes jump, so the
    // thumb does not trail behind the tabs.
    function placeThumb({ animate = true } = {}) {
      const elements = tabElements.get(state.activeId)
      thumb.style.opacity = elements ? '1' : '0'
      if (!elements) return
      if (!animate) tabList.classList.remove('is-ready')
      thumb.style.setProperty('--thumb-x', `${elements.root.offsetLeft}px`)
      thumb.style.setProperty('--thumb-width', `${elements.root.offsetWidth}px`)
      // The thumb lands in place first, and only glides after that.
      if (!tabList.classList.contains('is-ready')) {
        thumb.getBoundingClientRect()
        requestAnimationFrame(() => tabList.classList.add('is-ready'))
      }
    }
    window.addEventListener('resize', () => placeThumb({ animate: false }))

    // Fades the ends of the strip that have more tabs past them.
    function fadeTabs() {
      const past = tabList.scrollWidth - tabList.clientWidth - tabList.scrollLeft
      tabList.style.setProperty('--fade-left', `${Math.min(28, Math.max(0, tabList.scrollLeft))}px`)
      tabList.style.setProperty('--fade-right', `${Math.min(28, Math.max(0, past))}px`)
    }
    tabList.addEventListener('scroll', fadeTabs)
    new ResizeObserver(fadeTabs).observe(tabList)

    // Where a tab is along the strip's length, wherever its glide has got to.
    const tabLeft = (root) => root.getBoundingClientRect().left + tabList.scrollLeft
    // Tabs glide from where they were (`lefts`, by id), along with the thumb.
    function glideTabs(lefts) {
      for (const [id, elements] of tabElements) {
        const from = lefts.get(id) - tabLeft(elements.root)
        if (!from || matchMedia('(prefers-reduced-motion: reduce)').matches) continue
        elements.glide = elements.root.animate([{ transform: `translateX(${from}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.22, 1, .36, 1)' })
      }
    }

    // Dragging a tab along the strip moves it there. Near an end, Chromium
    // scrolls a strip with more past it.
    const strip = document.getElementById('strip')
    let draggedTab = null
    // The tab it would land before at `x`, null for last, or undefined if it
    // would stay where it is. By where the tabs are laid out, as some may
    // still be gliding there.
    function tabDropAt(x) {
      const ids = state.tabs.map((tab) => tab.id)
      const along = x - tabList.getBoundingClientRect().left + tabList.scrollLeft
      const at = ids.findIndex((id) => {
        const { offsetLeft, offsetWidth } = tabElements.get(id).root
        return along < offsetLeft + offsetWidth / 2
      })
      const to = at === -1 ? ids.length : at
      const from = ids.indexOf(draggedTab)
      return to === from || to === from + 1 ? undefined : ids[to] ?? null
    }
    function markTabDrop(before) {
      const last = state.tabs.at(-1)?.id
      for (const [id, { root }] of tabElements) {
        root.classList.toggle('drop-before', id === before)
        root.classList.toggle('drop-after', before === null && id === last)
      }
    }
    // What had focus in the toolbar as a tab was pressed, or null if the page
    // did. Pressing the toolbar then focuses its window just before.
    let pressedFrom = null
    let focusedAt = -Infinity
    window.addEventListener('focus', () => { focusedAt = performance.now() })
    function endTabDrag() {
      tabElements.get(draggedTab)?.root.classList.remove('is-dragged')
      draggedTab = null
      markTabDrop(undefined)
    }
    strip.addEventListener('dragover', (event) => {
      if (draggedTab === null) return
      event.preventDefault()
      event.dataTransfer.dropEffect = 'move'
      markTabDrop(tabDropAt(event.clientX))
    })
    strip.addEventListener('dragleave', (event) => { if (!strip.contains(event.relatedTarget)) markTabDrop(undefined) })
    strip.addEventListener('drop', (event) => {
      if (draggedTab === null) return
      event.preventDefault()
      // Read again, as the strip may have scrolled since.
      const before = tabDropAt(event.clientX)
      if (before !== undefined) window.lit.moveTab(draggedTab, before)
      endTabDrag()
    })

    // Arrow keys move between tabs like other tab lists, and with ⇧ move the
    // tab itself; Delete closes one.
    // All start from the focused tab, not the last state from the main
    // process, so held or quick keys never act on a stale tab.
    let refocusTabs = false
    const focusedTabId = () => {
      for (const [id, elements] of tabElements) if (elements.root.contains(document.activeElement)) return id
      return state.activeId
    }
    tabList.addEventListener('keydown', (event) => {
      const ids = state.tabs.map((tab) => tab.id)
      const focusedId = focusedTabId()
      const index = ids.indexOf(focusedId)
      const target = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: ids.length - 1 }[event.key]
      if (event.key === 'Delete' || event.key === 'Backspace') {
        event.preventDefault()
        // Focus moves to whichever tab takes its place once the list updates.
        refocusTabs = true
        window.lit.closeTab(focusedId, false)
      } else if (event.shiftKey && !event.metaKey && !event.ctrlKey && !event.altKey && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
        event.preventDefault()
        window.lit.nudgeTab(focusedId, event.key === 'ArrowLeft' ? -1 : 1)
      } else if (target !== undefined) {
        event.preventDefault()
        const id = ids[(target + ids.length) % ids.length]
        window.lit.activateTab(id, false)
        tabElements.get(id)?.select.focus()
      }
    })

    document.getElementById('new-tab').addEventListener('click', () => window.lit.newTab())
    document.getElementById('open-settings').addEventListener('click', () => window.lit.openSettings())
    downloadsButton.addEventListener('click', () => window.lit.openDownloads())

    // Its menu hangs from the button.
    const profileButton = document.getElementById('open-profile')
    profileButton.addEventListener('click', () => {
      const { left, bottom } = profileButton.getBoundingClientRect()
      window.lit.openProfileMenu({ x: left, y: bottom + 4 })
    })
    window.lit.onProfile(({ name, color, shown }) => {
      profileButton.hidden = !shown
      profileButton.title = `Profile: ${name}`
      profileButton.setAttribute('aria-label', `Profile: ${name}`)
      profileButton.style.setProperty('--profile', color)
      document.getElementById('profile-mark').textContent = [...name][0].toUpperCase()
    })

    // The downloads indicator ({ count, active, progress } from main).
    // The ring keeps its last fill while it fades out, and a new batch of
    // downloads starts it from where they are rather than sweeping back.
    const ringFill = downloadsButton.querySelector('.ring-fill')
    let downloadsActive = false
    function drawDownloads({ count, active, progress }) {
      downloadsButton.classList.toggle('is-hidden', !count)
      downloadsButton.tabIndex = count ? 0 : -1
      downloadsButton.classList.toggle('is-active', active > 0)
      downloadsButton.classList.toggle('is-spinning', active > 0 && progress === null)
      if (active && !downloadsActive) {
        ringFill.style.transition = 'none'
        downloadsButton.style.setProperty('--left', String(100 - (progress ?? 0) * 100))
        ringFill.getBoundingClientRect()
        ringFill.style.transition = ''
      } else if (progress !== null) downloadsButton.style.setProperty('--left', String(100 - progress * 100))
      downloadsActive = active > 0
      const percent = progress === null ? '' : `, ${Math.floor(progress * 100)}%`
      downloadsButton.setAttribute('aria-label', active ? `Downloads, ${active} in progress${percent}` : 'Downloads')
    }
    zoomButton.addEventListener('click', () => window.lit.resetZoom())

    // Pages from history matching what is typed, listed under the field
    // by main (in a view over the page, src/suggestions.html). Arrow keys
    // move through them and put the page's address in the field, so Enter
    // opens it; going back past the first puts back what was typed. The
    // list closes with Escape, on sending, and when the field loses focus.
    let suggestions = []
    let selected = -1
    let typed = ''
    // Answers can arrive out of order; only the latest request's counts.
    let suggestRequest = 0
    async function suggest() {
      const request = ++suggestRequest
      typed = address.value
      // The old rows can't be picked while the new ones are on their way.
      suggestions = []
      selected = -1
      const box = address.getBoundingClientRect()
      const items = await window.lit.suggest(typed, { x: box.left, y: box.bottom + 6, width: box.width })
      if (request === suggestRequest) suggestions = items
    }
    // `blur` lets a click on the list, which takes focus from the field,
    // still open its page.
    function closeSuggestions(blur = false) {
      suggestRequest++
      suggestions = []
      selected = -1
      window.lit.closeSuggestions(blur === true)
    }
    function moveSelection(delta) {
      // -1 is the typed text itself, between the last page and the first.
      const count = suggestions.length + 1
      selected = ((selected + 1 + delta + count) % count) - 1
      const item = suggestions[selected]
      address.value = selected === -1 ? typed : item.kind === 'site' ? item.shortcut : item.url
      window.lit.selectSuggestion(selected)
    }
    window.addEventListener('resize', () => closeSuggestions())

    // Quick search (see src/quicksearch.js): { prefix, sites } from main,
    // or null while it is off. Typing a site's shortcut and a space (or
    // Tab), pasting one with a search, or picking a site from the list
    // shows the site as a chip at the start of the field; the field then
    // holds only the search. Backspace at the start puts the shortcut back
    // as text. The chip lasts until the search is sent or dropped.
    let quick = null
    // { site, alias } while the chip shows.
    let chip = null
    const chipBox = document.getElementById('chip')
    const siteFor = (alias) => quick?.sites.find((site) => site.aliases.includes(alias.toLowerCase()))
    const shortcutOf = (alias) => `${quick?.prefix ?? ''}${alias}`

    function measureChip() {
      if (chip) addressForm.style.setProperty('--chip-width', `${chipBox.offsetWidth}px`)
    }
    function setChip(next) {
      chip = next
      addressForm.classList.toggle('has-chip', Boolean(chip))
      if (chip) {
        chipBox.querySelector('img').src = chip.site.icon
        chipBox.querySelector('span').textContent = chip.site.name
        measureChip()
      }
      const label = chip ? `Search ${chip.site.name}` : homeLabel
      address.placeholder = label
      address.setAttribute('aria-label', label)
    }
    // Shows the chip with `search` in the field after it.
    // `caret` is where in the search the caret goes.
    function enterChip(site, alias, search = '', caret = search.length) {
      closeSuggestions()
      editing = true
      setChip({ site, alias })
      address.value = search
      address.setSelectionRange(caret, caret)
    }
    // The shortcut typed in full and followed by a space or a search, as
    // `!yt` and what follows, or null.
    function typedShortcut() {
      const match = quick && address.value.match(/^(\S+)\s+([\s\S]*)$/)
      if (!match || !match[1].startsWith(quick.prefix)) return null
      const alias = match[1].slice(quick.prefix.length)
      const site = siteFor(alias)
      return site && { site, alias: alias.toLowerCase(), search: match[2], end: match[1].length + 1 }
    }
    window.lit.onQuickSearch((next) => {
      // Turned off, or a new prefix: the chip goes back into the field as
      // the shortcut it was typed as.
      // Rows listed for the old prefix no longer apply.
      if (next?.prefix !== quick?.prefix && document.activeElement === address) closeSuggestions()
      if (chip && next?.prefix !== quick.prefix) {
        const text = fieldText()
        setChip(null)
        address.value = text
      }
      quick = next
    })
    window.lit.onQuickSearchPick(({ id, alias }) => {
      const site = quick?.sites.find((item) => item.id === id)
      if (!site) return
      address.focus()
      enterChip(site, alias)
    })

    // What the field holds, with the chip's shortcut back in front.
    const fieldText = () => (chip ? `${shortcutOf(chip.alias)} ${address.value}` : address.value)

    addressForm.addEventListener('submit', (event) => {
      event.preventDefault()
      // Enter on a site in the list shows its chip, to type the search.
      const item = !chip && suggestions[selected]
      if (item?.kind === 'site') {
        const site = siteFor(item.alias)
        if (site) return enterChip(site, item.alias)
      }
      const text = fieldText()
      if (!text.trim()) return
      closeSuggestions()
      document.body.classList.remove('home')
      // What was typed stays until the page's real address arrives.
      editing = false
      setChip(null)
      address.value = text
      window.lit.navigate(text)
      address.blur()
    })

    // Escape, or leaving the field unsent, puts back the current address.
    // While an input method composes, its half-typed text is not looked up.
    address.addEventListener('input', (event) => {
      editing = true
      if (event.isComposing) return
      if (!chip) {
        // A space right after a typed shortcut, or a pasted one, shows its chip.
        const found = typedShortcut()
        const pasted = event.inputType === 'insertFromPaste' || event.inputType === 'insertFromDrop'
        if (found && (pasted || (/^\s$/.test(event.data ?? '') && address.selectionStart === found.end))) {
          // The caret stays where it was in the search.
          const caret = found.search.length - (address.value.length - address.selectionStart)
          return enterChip(found.site, found.alias, found.search, Math.max(0, caret))
        }
      }
      // The site's search lists nothing under the field.
      if (chip) closeSuggestions()
      else suggest()
    })
    // An input method can commit the space, or it and the search, at once.
    address.addEventListener('compositionend', (event) => {
      if (chip) return
      const found = /\s/.test(event.data ?? '') && typedShortcut()
      if (found) enterChip(found.site, found.alias, found.search, Math.max(0, found.search.length - (address.value.length - address.selectionStart)))
      else suggest()
    })
    address.addEventListener('keydown', (event) => {
      if (event.isComposing || event.keyCode === 229) return
      const plain = !event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey
      // Backspace at the very start of the search puts the shortcut back as text.
      if (chip && event.key === 'Backspace' && plain && address.selectionStart === 0 && address.selectionEnd === 0) {
        event.preventDefault()
        const shortcut = shortcutOf(chip.alias)
        const search = address.value
        setChip(null)
        address.value = search ? `${shortcut} ${search}` : shortcut
        address.setSelectionRange(shortcut.length, shortcut.length)
        suggest()
        return
      }
      // Tab on a site in the list, or after its whole shortcut, shows its chip.
      if (!chip && quick && event.key === 'Tab' && plain) {
        const item = suggestions[selected]
        const alias = item?.kind === 'site' ? item.alias : address.value.startsWith(quick.prefix) ? address.value.slice(quick.prefix.length) : ''
        const site = alias && !/\s/.test(alias) && siteFor(alias)
        if (site) {
          event.preventDefault()
          return enterChip(site, alias.toLowerCase())
        }
      }
      if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && suggestions.length) {
        event.preventDefault()
        moveSelection(event.key === 'ArrowDown' ? 1 : -1)
      } else if (event.key === 'Escape' && suggestions.length) {
        // The first Escape only closes the list and puts back what was typed.
        address.value = typed
        closeSuggestions()
      } else if (event.key === 'Escape') {
        // Also drops a lookup still on its way.
        closeSuggestions()
        setChip(null)
        editing = false
        address.value = currentUrl()
        address.select()
      }
    })
    address.addEventListener('blur', () => {
      closeSuggestions(true)
      if (editing) { editing = false; setChip(null); address.value = currentUrl() }
    })
    address.addEventListener('focus', () => address.select())

    // Searches as you type; Enter and ⇧Enter step through the matches.
    // Escape closes from anywhere in the field, its buttons included (and
    // from the page; see main).
    // While an input method (Zhuyin, Pinyin) composes, its half-typed text
    // is not searched, and the keys that confirm or cancel its candidates
    // belong to it, not to the find field.
    const search = () => window.lit.find(state.activeId, findInput.value)
    findInput.addEventListener('input', (event) => { if (!event.isComposing) search(); drawFindCount() })
    findInput.addEventListener('compositionend', search)
    findInput.addEventListener('keydown', (event) => {
      if (event.isComposing || event.keyCode === 229) return
      // Only Enter and ⇧Enter; Enter with ⌘, ⌃ or ⌥ may be someone's shortcut.
      if (event.key === 'Enter' && !event.metaKey && !event.ctrlKey && !event.altKey) {
        event.preventDefault()
        window.lit.findAgain(state.activeId, !event.shiftKey)
      }
    })
    findBox.addEventListener('keydown', (event) => {
      if (event.isComposing || event.keyCode === 229) return
      if (event.key === 'Escape') { event.preventDefault(); window.lit.closeFind(state.activeId) }
    })
    findPrevious.addEventListener('click', () => window.lit.findAgain(state.activeId, false))
    findNext.addEventListener('click', () => window.lit.findAgain(state.activeId, true))
    document.getElementById('find-close').addEventListener('click', () => window.lit.closeFind(state.activeId))

    window.lit.onTabs(render)
    window.lit.onBookmarks(drawBookmarks)
    window.lit.onDownloads(drawDownloads)
    window.lit.onShortcuts((labels) => {
      shortcutLabels = labels
      document.querySelectorAll('[data-shortcut]').forEach(labelShortcut)
    })
    window.lit.onFocusAddress(() => {
      // Selects everything, so a chip goes back to being text too.
      if (chip) {
        const text = fieldText()
        setChip(null)
        address.value = text
      }
      address.focus()
      address.select()
    })
    window.lit.onFocusFind(() => { findInput.focus(); findInput.select() })
  </script>
</body>
</html>
