<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
  <title>History</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --dim: #848484;
      --sub: #8c8c8c;
      --line: rgba(255, 255, 255, .18);
      --line-hover: rgba(255, 255, 255, .34);
      --line-live: rgba(255, 255, 255, .72);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    /* The page is a transparent layer over the browser window; only the
       backdrop and the panel draw anything. */
    html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; color: #ededed; }
    body { user-select: none; }
    button, input { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: 3px; }

    /* The kit's popup, as in Settings: replays its keyframes on each open. */
    .backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, .5);
      opacity: 0;
    }
    .is-open .backdrop { opacity: 1; animation: popup-fade 160ms ease-out; }
    .panel {
      position: relative;
      width: min(720px, 100%);
      height: min(540px, 100%);
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .45);
      overflow: hidden;
    }
    .is-open .panel { animation: popup-in 240ms var(--settle); }
    .panel:focus { outline: 0; }
    @keyframes popup-fade { from { opacity: 0; } }
    @keyframes popup-in { from { opacity: 0; transform: scale(.96); } }

    .head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 0 24px; }
    .head h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -.015em; }
    .tools { display: flex; flex-direction: column; gap: 10px; padding: 14px 24px 6px; }
    .note { margin: 0; font-size: 11.5px; line-height: 1.5; color: var(--sub); }
    .note[hidden] { display: none; }
    .note.error { color: #ff8a80; }

    /* The kit's outline button, small. */
    .outline-button {
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -.01em;
      transition: box-shadow 200ms ease, transform 140ms var(--settle), opacity 160ms ease-out;
    }
    .outline-button:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .outline-button:active:not(:disabled) { transform: scale(.97); transition-duration: 55ms; }
    .outline-button:disabled { opacity: .4; cursor: default; }

    /* The kit's quiet icon button, for closing and removing. */
    .icon-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #bdbdbd;
      box-shadow: inset 0 0 0 1px transparent;
      cursor: pointer;
      transition: color 180ms ease-out, box-shadow 200ms ease, opacity 160ms ease-out, transform 140ms var(--settle);
    }
    .icon-button:hover { color: #fff; box-shadow: inset 0 0 0 1px var(--line-hover); }
    .icon-button:active { transform: scale(.94); }

    /* The kit's search field, at a compact height. */
    .search-field { position: relative; }
    .search-field input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 40px;
      padding: 0 40px 0 38px;
      border: 0;
      border-radius: 10px;
      outline: 0;
      color: #ededed;
      background: transparent;
      font-size: 13px;
      letter-spacing: -.01em;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: box-shadow 200ms ease;
      user-select: text;
    }
    .search-field input::placeholder { color: var(--dim); }
    .search-field input:hover { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .search-field input:focus { box-shadow: inset 0 0 0 1px var(--line-live); }
    .search-field input::-webkit-search-cancel-button { display: none; }
    .search-icon { position: absolute; top: 50%; left: 14px; color: var(--dim); transform: translateY(-50%); pointer-events: none; transition: color 200ms ease; }
    .search-field:focus-within .search-icon { color: #fff; }
    .search-clear {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      color: #cfcfcf;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: scale(.8);
      transition: opacity 160ms ease-out, transform 200ms var(--settle), visibility 0s 200ms, background-color 140ms ease-out;
    }
    .search-field.has-value .search-clear { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .search-clear:hover { color: #fff; background: rgba(255, 255, 255, .14); }

    /* Pages, grouped by day. A row opens its page; its remove button shows
       on hover or keyboard focus, and always on touch. */
    .list { flex: 1; min-height: 0; overflow: auto; padding: 8px 24px 24px; scroll-padding-top: 36px; }
    /* The day stays at the top while its own pages scroll under it. */
    .day {
      position: sticky;
      top: -8px;
      z-index: 1;
      margin: 0;
      padding: 12px 0 6px;
      background: #1c1c1c;
      font-size: 12px;
      font-weight: 500;
      color: var(--sub);
      letter-spacing: -.01em;
    }
    .day-group + .day-group { margin-top: 6px; }
    .day-group:first-child { margin-top: -4px; }
    .rows { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
    .row { display: flex; align-items: center; gap: 8px; }
    .page {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .page:focus-visible { outline-offset: 2px; border-radius: 6px; }
    .page-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
    .page strong {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -.01em;
      color: #d6d6d6;
      transition: color 200ms ease;
    }
    .page small {
      /* The room the title leaves, and 40% of the row if it would leave
         less, so far as the site needs it. */
      flex: 1 0 40%;
      min-width: 0;
      max-width: max-content;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11.5px;
      color: var(--sub);
      transition: color 200ms ease;
    }
    .page:hover strong { color: #fff; }
    .page:hover small { color: #bdbdbd; }
    .time { flex: 0 0 auto; font: 400 11px/1 'DM Mono', ui-monospace, monospace; color: var(--sub); font-variant-numeric: tabular-nums; }
    @media (hover: hover) {
      .row .remove { opacity: 0; }
      .row:hover .remove, .row:focus-within .remove { opacity: 1; }
    }
    .more { margin-top: 14px; }

    /* The kit's empty state. */
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 64px 24px; text-align: center; }
    .empty-state strong { font-size: 14px; font-weight: 500; color: #fff; }
    .empty-state p { max-width: 36ch; margin: 0; font-size: 12.5px; line-height: 1.7; color: var(--sub); }
    .empty-state .outline-button { margin-top: 12px; }

    /* The kit's confirmation popup, over the panel, for Clear History. */
    .confirm-backdrop {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, .5);
      animation: popup-fade 160ms ease-out;
    }
    .confirm-backdrop[hidden] { display: none; }
    .confirm {
      width: min(340px, 100%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px;
      border-radius: 16px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line), 0 16px 40px rgba(0, 0, 0, .4);
      animation: popup-in 240ms var(--settle);
    }
    .confirm strong { font-size: 13px; font-weight: 500; letter-spacing: -.01em; }
    .confirm p { margin: 0; font-size: 12.5px; line-height: 1.7; color: var(--sub); }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .confirm-actions .outline-button { height: 40px; }
    .confirm-actions .outline-button.is-danger { background: #e5484d; box-shadow: none; transition: background-color 200ms ease, transform 140ms var(--settle); }
    .confirm-actions .outline-button.is-danger:hover { background: #ec5d61; }

    @media (max-width: 600px) {
      .head { padding-left: 16px; }
      .tools, .list { padding-left: 16px; padding-right: 16px; }
      .page-text { flex-direction: column; gap: 3px; }
      .page small { flex: 0 0 auto; max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop">
    <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="history-title" tabindex="-1">
      <div class="head">
        <h1 id="history-title">History</h1>
        <button class="outline-button" id="clear" type="button">Clear History</button>
        <button class="icon-button" id="close" type="button" aria-label="Close history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>
      <div class="tools">
        <div class="search-field" id="search-field">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="search" type="search" placeholder="Search history" aria-label="Search history" spellcheck="false" autocomplete="off">
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" tabindex="-1">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>
        <p class="note" id="off-note" hidden>Save history is off in Settings, so new pages and closed tabs aren’t remembered.</p>
        <p class="note error" id="error" role="alert" hidden></p>
      </div>
      <div class="list" id="list"></div>

      <div class="confirm-backdrop" id="confirm" hidden>
        <div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-note">
          <strong id="confirm-title">Clear history?</strong>
          <p id="confirm-note">Every saved page is removed, and closed tabs can no longer be reopened.</p>
          <div class="confirm-actions">
            <button class="outline-button" id="confirm-cancel" type="button">Cancel</button>
            <button class="outline-button is-danger" id="confirm-clear" type="button">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <template id="remove-icon">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
  </template>

  <script>
    // Draws the pages main keeps (src/history.js), newest first, grouped by
    // day. Clicking a page opens it in the current tab; ⌘-click opens it in
    // a background tab and keeps History open.
    const history = window.lit.history
    const backdrop = document.getElementById('backdrop')
    const panel = document.getElementById('panel')
    const list = document.getElementById('list')
    const search = document.getElementById('search')
    const searchField = document.getElementById('search-field')
    const clear = document.getElementById('clear')
    const confirm = document.getElementById('confirm')

    // Rows drawn at once; Show More adds this many again.
    const PAGE = 300
    let state = { entries: [], enabled: true }
    let shown = PAGE

    const el = (tag, className, text) => {
      const element = document.createElement(tag)
      if (className) element.className = className
      if (text !== undefined) element.textContent = text
      return element
    }

    // "example.com/path" for a page with no title, and as its quiet second line.
    function place(url) {
      try {
        const { protocol, host, pathname } = new URL(url)
        return protocol === 'file:' ? decodeURIComponent(pathname) : host
      } catch {
        return url
      }
    }

    const startOfDay = (time) => { const day = new Date(time); day.setHours(0, 0, 0, 0); return day.getTime() }
    function dayLabel(time) {
      const today = startOfDay(Date.now())
      const day = startOfDay(time)
      if (day === today) return 'Today'
      if (day === startOfDay(today - 1)) return 'Yesterday'
      const sameYear = new Date(day).getFullYear() === new Date(today).getFullYear()
      return new Date(day).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', ...(!sameYear && { year: 'numeric' }) })
    }
    const timeLabel = (time) => new Date(time).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })

    function matches() {
      const words = search.value.toLowerCase().split(/\s+/).filter(Boolean)
      if (!words.length) return state.entries
      return state.entries.filter((entry) => {
        const text = `${entry.title} ${entry.url}`.toLowerCase()
        return words.every((word) => text.includes(word))
      })
    }

    function row(entry) {
      const item = el('li', 'row')
      const page = el('button', 'page')
      page.type = 'button'
      page.dataset.url = entry.url
      page.title = entry.url
      const text = el('span', 'page-text')
      text.append(el('strong', '', entry.title || place(entry.url)), el('small', '', place(entry.url)))
      page.append(text, el('span', 'time', timeLabel(entry.time)))
      page.addEventListener('click', (event) => history.open(entry.url, event.metaKey || event.ctrlKey))
      const remove = el('button', 'icon-button remove')
      remove.type = 'button'
      remove.setAttribute('aria-label', `Remove ${entry.title || place(entry.url)} from history`)
      remove.title = 'Remove from history'
      remove.append(document.getElementById('remove-icon').content.cloneNode(true))
      remove.addEventListener('click', () => removePage(entry.url, page))
      item.append(page, remove)
      return item
    }

    // Redraws the list. Focus stays on the same page when it is still
    // there, so removing or a change from another window keeps your place.
    function draw(focusUrl = document.activeElement?.closest?.('.row')?.querySelector('.page')?.dataset.url) {
      const top = list.scrollTop
      const found = matches()
      clear.disabled = state.entries.length === 0 && !state.closedTabs
      document.getElementById('off-note').hidden = state.enabled
      const error = document.getElementById('error')
      error.textContent = state.error || ''
      error.hidden = !state.error
      if (!found.length) {
        const empty = el('div', 'empty-state')
        if (search.value.trim()) {
          empty.append(el('strong', '', 'No pages match'), el('p', '', 'Try other words, or clear the search.'))
          const button = el('button', 'outline-button', 'Clear search')
          button.type = 'button'
          button.addEventListener('click', clearSearch)
          empty.append(button)
        } else {
          empty.append(el('strong', '', 'No history'), el('p', '', state.enabled ? 'Pages you visit show up here.' : 'Turn on Save history in Settings to keep the pages you visit.'))
        }
        list.replaceChildren(empty)
        return
      }
      const children = []
      let rows = null
      let day = null
      for (const entry of found.slice(0, shown)) {
        const label = dayLabel(entry.time)
        if (label !== day) {
          day = label
          const group = el('section', 'day-group')
          rows = el('ul', 'rows')
          group.append(el('h2', 'day', label), rows)
          children.push(group)
        }
        rows.append(row(entry))
      }
      if (found.length > shown) {
        const more = el('button', 'outline-button more', 'Show More')
        more.type = 'button'
        more.addEventListener('click', () => { shown += PAGE; draw() })
        children.push(more)
      }
      list.replaceChildren(...children)
      list.scrollTop = top
      if (focusUrl) list.querySelector(`.page[data-url="${CSS.escape(focusUrl)}"]`)?.focus()
    }

    // Focus moves to the next page (or the one before) so the keyboard
    // keeps its place in the list.
    function removePage(url, page) {
      const pages = [...list.querySelectorAll('.page')]
      const index = pages.indexOf(page)
      const next = pages[index + 1] || pages[index - 1]
      state = { ...state, entries: state.entries.filter((entry) => entry.url !== url), error: '' }
      draw(next?.dataset.url)
      if (!next) search.focus()
      history.remove(url).then(answer)
    }

    // Main's reply to a removal: the list as saved, and why if it wasn't.
    function answer(next) {
      state = next
      draw()
    }

    const searchClear = document.getElementById('search-clear')
    function clearSearch() {
      search.value = ''
      searchField.classList.remove('has-value')
      searchClear.tabIndex = -1
      shown = PAGE
      draw()
      search.focus()
    }
    search.addEventListener('input', () => {
      searchField.classList.toggle('has-value', Boolean(search.value))
      searchClear.tabIndex = search.value ? 0 : -1
      shown = PAGE
      draw()
    })
    searchClear.addEventListener('click', clearSearch)

    // ↑ and ↓ move between pages, and from the search box into the list;
    // Delete removes the focused page.
    list.addEventListener('keydown', (event) => {
      const page = event.target.closest('.page')
      if (!page) return
      const pages = [...list.querySelectorAll('.page')]
      const index = pages.indexOf(page)
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault()
        const next = pages[index + (event.key === 'ArrowDown' ? 1 : -1)]
        if (next) next.focus()
        else if (event.key === 'ArrowUp') search.focus()
      } else if (event.key === 'Backspace' || event.key === 'Delete') {
        event.preventDefault()
        removePage(page.dataset.url, page)
      } else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
        event.preventDefault()
        history.open(page.dataset.url, true)
      }
    })
    search.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') {
        event.preventDefault()
        list.querySelector('.page')?.focus()
      } else if (event.key === 'Enter') {
        list.querySelector('.page')?.click()
      }
    })

    // Clearing everything asks first.
    function showConfirm(on) {
      confirm.hidden = !on
      if (on) document.getElementById('confirm-cancel').focus()
      else clear.focus()
    }
    clear.addEventListener('click', () => showConfirm(true))
    document.getElementById('confirm-cancel').addEventListener('click', () => showConfirm(false))
    document.getElementById('confirm-clear').addEventListener('click', () => {
      state = { ...state, entries: [], error: '' }
      history.clear().then(answer)
      confirm.hidden = true
      draw()
      search.focus()
    })
    confirm.addEventListener('mousedown', (event) => { if (event.target === confirm) showConfirm(false) })

    // Each open replays the popup's keyframes, starts a fresh search, and
    // puts the cursor in it.
    function open(next) {
      state = next
      confirm.hidden = true
      search.value = ''
      searchField.classList.remove('has-value')
      searchClear.tabIndex = -1
      shown = PAGE
      draw(null)
      list.scrollTop = 0
      document.body.classList.remove('is-open')
      document.body.getBoundingClientRect()
      document.body.classList.add('is-open')
      search.focus()
    }

    const close = () => history.close()
    document.getElementById('close').addEventListener('click', close)
    backdrop.addEventListener('mousedown', (event) => { if (event.target === backdrop) close() })
    // Escape closes the confirmation, then clears the search, then History.
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return
      event.preventDefault()
      if (!confirm.hidden) showConfirm(false)
      else if (search.value) clearSearch()
      else close()
    })
    // Tab stays inside the confirmation while it is open.
    confirm.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab') return
      const buttons = [...confirm.querySelectorAll('button')]
      const index = buttons.indexOf(document.activeElement)
      event.preventDefault()
      buttons[(index + (event.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus()
    })

    history.onOpen(open)
    // A page was visited, removed or cleared elsewhere.
    history.onChanged((next) => { state = next; draw() })
    // The first open is sent before this page has loaded, so it asks.
    history.get().then(open)
  </script>
</body>
</html>
