<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; script-src 'self' 'unsafe-inline'">
  <title>Saved logins</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --dim: #848484;
      --line: rgba(255, 255, 255, .18);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    /* The view is exactly the list's size (main sizes it from LOGINS_HEADER,
       SUGGESTION_ROW and SUGGESTIONS_PAD), transparent around the menu's corners. */
    html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; user-select: none; }

    /* The kit's select menu: stays mounted and eases in and out by class. */
    .menu {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 5px;
      /* Only when the window is too short for the whole list. */
      overflow: hidden auto;
      scrollbar-width: none;
      border-radius: 12px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line);
      opacity: 0;
      transform: translateY(-4px) scale(.98);
      transform-origin: top;
      transition: opacity 160ms ease-out, transform 240ms var(--settle);
    }
    .menu.is-open { opacity: 1; transform: none; }

    .row {
      height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      border-radius: 8px;
      color: #a8a8a8;
      font-size: 13px;
      letter-spacing: -.01em;
      cursor: default;
      transition: background-color 140ms ease-out, color 140ms ease-out;
    }
    .row:hover, .row.is-selected { color: #fff; background: rgba(255, 255, 255, .07); }
    .row svg { flex: 0 0 auto; color: var(--dim); }
    .title, .url { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .title { flex: 0 1 auto; color: #ededed; }
    .url { flex: 1 1 0; min-width: 80px; color: var(--dim); font-size: 12px; }

    .site {
      height: 26px;
      flex: 0 0 auto;
      padding: 8px 11px 0;
      overflow: hidden;
      color: var(--dim);
      font-size: 11.5px;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: left;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="menu" id="menu">
    <div class="site"><bdi id="site" dir="ltr"></bdi></div>
    <div id="rows" role="listbox" aria-label="Saved logins"></div>
  </div>
  <template id="row-template">
    <div class="row" role="option" aria-selected="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="7.5" cy="15.5" r="5.5"></circle><path d="m21 2-9.6 9.6"></path><path d="m15.5 7.5 3 3L22 7l-3-3"></path>
      </svg>
      <span class="title"></span>
    </div>
  </template>

  <script>
    // The site's saved logins; main sizes the view, moves the selection and
    // fills the one picked. No password ever comes here.
    const menu = document.getElementById('menu')
    const rows = document.getElementById('rows')
    const template = document.getElementById('row-template')

    window.lit.logins.onShow(({ logins, site, generation }) => {
      document.getElementById('site').textContent = site
      rows.replaceChildren(...logins.map(({ id, username }) => {
        const row = template.content.firstElementChild.cloneNode(true)
        row.querySelector('.title').textContent = username || 'No username'
        // Picked on press: the page's field closes the list as it loses
        // focus to this click, and the list only lasts while it fades out.
        row.addEventListener('mousedown', (event) => {
          if (event.button === 0 && event.isTrusted) window.lit.logins.pick(id, generation)
        })
        return row
      }))
      menu.scrollTop = 0
      // Opens from its closed state, so it eases in each time it appears.
      if (!menu.classList.contains('is-open')) requestAnimationFrame(() => menu.classList.add('is-open'))
    })
    window.lit.logins.onSelect((index) => {
      for (const [i, row] of [...rows.children].entries()) {
        row.classList.toggle('is-selected', i === index)
        row.setAttribute('aria-selected', String(i === index))
        if (i === index) row.scrollIntoView({ block: 'nearest' })
      }
    })
    window.lit.logins.onHide(() => menu.classList.remove('is-open'))
  </script>
</body>
</html>
