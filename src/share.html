<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- img-src allows the tabs' favicons, which load from anywhere. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: http: data:; script-src 'self' 'unsafe-inline'">
  <title>Share your screen</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --dim: #848484;
      --sub: #8c8c8c;
      --line: rgba(255, 255, 255, .18);
      --line-hover: rgba(255, 255, 255, .34);
      --line-live: rgba(255, 255, 255, .72);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; color: #ededed; user-select: none; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: 3px; }
    /* Native radios and checkbox, drawn by what follows them. */
    input { position: absolute; opacity: 0; pointer-events: none; }

    /* The kit's popup, as in settings.html. */
    .backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .5); opacity: 0; }
    .is-open .backdrop { opacity: 1; animation: popup-fade 160ms ease-out; }
    .panel {
      width: min(640px, 100%);
      height: min(520px, 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      border-radius: 16px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .45);
    }
    .is-open .panel { animation: popup-in 240ms var(--settle); }
    .panel:focus { outline: 0; }
    @keyframes popup-fade { from { opacity: 0; } }
    @keyframes popup-in { from { opacity: 0; transform: scale(.96); } }
    h1 { margin: 0; font-size: 13px; font-weight: 500; line-height: 1.5; letter-spacing: -.01em; overflow-wrap: anywhere; }

    /* The kit's segmented control; its three labels share the width. */
    .segmented { position: relative; flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
    .segmented-thumb {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      border-radius: 8px;
      background: #fff;
      transform: translateX(calc(var(--index, 0) * 100%));
      transition: transform 320ms var(--settle);
    }
    .is-mounting .segmented-thumb, .is-mounting .segmented span { transition: none; }
    .segmented label { position: relative; cursor: pointer; }
    .segmented label span {
      display: grid;
      place-items: center;
      height: 30px;
      border-radius: 8px;
      color: #8a8a8a;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -.01em;
      transition: color 260ms ease;
    }
    .segmented label:hover input:not(:checked) + span { color: #e6e6e6; }
    .segmented input:checked + span { color: #0a0a0a; }
    .segmented input:focus-visible + span { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: 5px; }

    .choices { position: relative; flex: 1; min-height: 0; overflow: auto; margin: 0 -8px; padding: 2px 8px; }
    .options { animation: panel-enter 260ms var(--settle); }
    @keyframes panel-enter { from { opacity: 0; transform: translateY(4px); } }
    .options.is-list { display: flex; flex-direction: column; gap: 2px; }
    .options.is-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .option { position: relative; min-width: 0; cursor: pointer; }
    .option-body {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow 200ms ease;
    }
    .is-list .option-body { height: 40px; padding: 0 12px; }
    .is-grid .option-body { flex-wrap: wrap; gap: 8px; padding: 8px; box-shadow: inset 0 0 0 1px var(--line); }
    .option:hover .option-body { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .option input:checked + .option-body { box-shadow: inset 0 0 0 1.5px #fff; }
    .option input:focus-visible + .option-body { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: 1px; }
    .picture { flex: 0 0 100%; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: #0a0a0a; }
    .picture img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .icon { flex: none; width: 16px; height: 16px; }
    .name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12.5px; line-height: 1.4; letter-spacing: -.01em; }

    /* The kit's empty state, small. */
    .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
    .empty-state strong { font-size: 13px; font-weight: 500; color: #fff; }
    .empty-state p { max-width: 44ch; margin: 0; font-size: 12px; line-height: 1.7; color: var(--sub); }
    .empty-state .outline-button { margin-top: 10px; }

    .foot { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .spacer { flex: 1; }
    /* The kit's checkbox, small. */
    .checkbox-row { position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12.5px; letter-spacing: -.01em; }
    .checkbox-box { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); transition: background-color 200ms ease, box-shadow 200ms ease; }
    .checkbox-row:hover .checkbox-box { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .checkbox-row input:checked + .checkbox-box { background: #fff; box-shadow: inset 0 0 0 1px #fff; }
    .checkbox-row input:focus-visible + .checkbox-box { outline: 2px solid rgba(255, 255, 255, .8); outline-offset: 3px; }
    .check-mark { width: 12px; height: 12px; fill: none; stroke: #0b0b0b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 240ms cubic-bezier(.65, 0, .35, 1); }
    .checkbox-row input:checked + .checkbox-box .check-mark { stroke-dashoffset: 0; transition-delay: 70ms; }

    /* The kit's outline button. */
    .outline-button {
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -.01em;
      transition: box-shadow 200ms ease, transform 140ms var(--settle), opacity 160ms ease-out;
    }
    .outline-button:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line-hover); }
    .outline-button:active:not(:disabled) { transform: scale(.97); transition-duration: 55ms; }
    .outline-button:disabled { opacity: .4; cursor: default; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop">
    <form class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="title" tabindex="-1">
      <h1 id="title"></h1>
      <div class="segmented" id="kinds" role="radiogroup" aria-label="What to share">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <label><input type="radio" name="kind" value="tabs"><span>Tabs</span></label>
        <label><input type="radio" name="kind" value="windows"><span>Windows</span></label>
        <label><input type="radio" name="kind" value="screens"><span>Screens</span></label>
      </div>
      <div class="choices" id="choices"></div>
      <div class="foot">
        <label class="checkbox-row" id="audio-row">
          <input type="checkbox" id="audio">
          <span class="checkbox-box"><svg class="check-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7" pathLength="1"/></svg></span>
          Share the tab’s sound
        </label>
        <span class="spacer"></span>
        <button class="outline-button" id="cancel" type="button">Cancel</button>
        <button class="outline-button" id="share" type="submit">Share</button>
      </div>
    </form>
  </div>

  <!-- A tab without a favicon, as in the tab strip. -->
  <template id="globe">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#848484" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
  </template>

  <script>
    // Asks what to share with a site, from what main sends (shareState):
    // `windows` and `screens` are null until they have been listed. Nothing is
    // chosen to begin with, so a stray Enter or click shares nothing.
    const share = window.lit.share
    const $ = (id) => document.getElementById(id)
    const kinds = [...document.querySelectorAll('[name="kind"]')]
    let state = null
    let kind = 'tabs'
    let chosen = null

    function el(tag, className, text) {
      const element = document.createElement(tag)
      if (className) element.className = className
      if (text) element.textContent = text
      return element
    }

    function image(src, className) {
      const img = el('img', className)
      img.alt = ''
      img.src = src
      img.draggable = false
      img.addEventListener('error', () => { img.style.visibility = 'hidden' })
      return img
    }

    function option(row) {
      const label = el('label', 'option')
      const input = el('input')
      input.type = 'radio'
      input.name = 'option'
      input.addEventListener('change', () => { chosen = row; drawFoot() })
      const body = el('span', 'option-body')
      if (kind !== 'tabs') {
        const picture = el('span', 'picture')
        if (row.thumbnail) picture.append(image(row.thumbnail))
        body.append(picture)
      }
      if (row.icon) body.append(image(row.icon, 'icon'))
      else if (kind === 'tabs') body.append($('globe').content.cloneNode(true))
      const name = el('span', 'name', row.name)
      name.title = row.name
      body.append(name)
      label.append(input, body)
      label.addEventListener('dblclick', submit)
      return label
    }

    function empty(title, text, action) {
      const box = el('div', 'empty-state')
      box.append(el('strong', '', title))
      if (text) box.append(el('p', '', text))
      if (action) box.append(action)
      return box
    }

    function drawChoices() {
      const rows = state[kind]
      let content
      if (kind !== 'tabs' && !state.allowed) {
        const button = el('button', 'outline-button', 'Open System Settings')
        button.type = 'button'
        button.addEventListener('click', () => share.allow(state.id))
        content = empty('Lit can’t see your screen yet', 'Turn on Lit under Screen & System Audio Recording in System Settings, then reopen Lit. Tabs can be shared without it.', button)
      } else if (!rows) content = empty('Looking for what you can share…')
      else if (!rows.length) content = kind === 'tabs' ? empty('No other tabs', 'Open the page you want to share in another tab.') : empty(kind === 'windows' ? 'No windows found' : 'No screens found')
      else {
        content = el('div', `options ${kind === 'tabs' ? 'is-list' : 'is-grid'}`)
        content.setAttribute('role', 'radiogroup')
        content.setAttribute('aria-label', kind)
        content.append(...rows.map(option))
      }
      $('choices').replaceChildren(content)
      $('choices').scrollTop = 0
    }

    function drawFoot() {
      $('share').disabled = chosen === null
      $('audio-row').hidden = kind !== 'tabs' || !state.audio || !state.tabs.length
    }

    function show(next) {
      kind = next
      chosen = null
      for (const input of kinds) input.checked = input.value === kind
      $('kinds').style.setProperty('--index', kinds.findIndex((input) => input.checked))
      drawChoices()
      drawFoot()
    }

    function open(next) {
      if (!next) return
      state = next
      $('title').textContent = `Choose what to share with ${state.site}`
      $('audio').checked = true
      document.body.classList.remove('is-open')
      document.body.classList.add('is-mounting')
      show(state.tabs.length || !state.allowed ? 'tabs' : 'windows')
      document.body.getBoundingClientRect()
      document.body.classList.remove('is-mounting')
      document.body.classList.add('is-open')
      $('panel').focus()
    }

    function submit() {
      if (chosen !== null) share.choose(state.id, kind, chosen.id, !$('audio-row').hidden && $('audio').checked, chosen.page)
    }

    for (const input of kinds) input.addEventListener('change', () => show(input.value))
    $('panel').addEventListener('submit', (event) => { event.preventDefault(); submit() })
    $('cancel').addEventListener('click', () => share.close(state?.id))
    $('backdrop').addEventListener('mousedown', (event) => { if (event.target === $('backdrop')) share.close(state?.id) })
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.preventDefault(); share.close(state?.id) }
    })

    share.onOpen(open)
    // A tab changed, or the windows and screens have been listed. A choice
    // stays, unless its tab has moved to another page. The list is redrawn
    // only if it changed, with its scroll and focus kept.
    share.onChanged((next) => {
      if (!state || !next) return
      const same = JSON.stringify(state[kind]) === JSON.stringify(next[kind])
      state = next
      if (same) return drawFoot()
      const before = chosen
      const scroll = $('choices').scrollTop
      const focused = document.activeElement.name === 'option'
      const listed = Boolean(document.querySelector('.options'))
      drawChoices()
      // It is the list already there, so it doesn't enter again.
      if (listed) document.querySelector('.options')?.style.setProperty('animation', 'none')
      $('choices').scrollTop = scroll
      const index = before ? (state[kind] || []).findIndex((row) => row.id === before.id && row.page === before.page) : -1
      chosen = index < 0 ? null : state[kind][index]
      const input = document.querySelectorAll('[name="option"]')[index]
      if (input) input.checked = true
      if (focused) (input || $('panel')).focus()
      drawFoot()
    })
    // The first open is sent before this page has loaded, so it asks.
    share.get().then(open)
  </script>
</body>
</html>
