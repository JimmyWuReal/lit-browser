<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; script-src 'self' 'unsafe-inline'">
  <title>Suggestions</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --dim: #848484;
      --line: rgba(255, 255, 255, .18);
      --settle: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    /* The view is exactly the list's size (main sizes it from SUGGESTION_ROW
       and SUGGESTIONS_PAD), transparent around the menu's corners. */
    html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; user-select: none; }

    /* The kit's select menu: stays mounted and eases in and out by class. */
    .menu {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 5px;
      /* Only when the window is too short for the whole list. */
      overflow: hidden auto;
      scrollbar-width: none;
      border-radius: 12px;
      background: #1c1c1c;
      box-shadow: inset 0 0 0 1px var(--line);
      opacity: 0;
      transform: translateY(-4px) scale(.98);
      transform-origin: top;
      transition: opacity 160ms ease-out, transform 240ms var(--settle);
    }
    .menu.is-open { opacity: 1; transform: none; }

    .row {
      height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      border-radius: 8px;
      color: #a8a8a8;
      font-size: 13px;
      letter-spacing: -.01em;
      cursor: default;
      transition: background-color 140ms ease-out, color 140ms ease-out;
    }
    .row:hover, .row.is-selected { color: #fff; background: rgba(255, 255, 255, .07); }
    .row svg { flex: 0 0 auto; color: var(--dim); }
    .title, .url { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .title { flex: 0 1 auto; color: #bdbdbd; }
    .url { flex: 1 1 0; min-width: 80px; color: var(--dim); font-size: 12px; }
    /* The words typed stand out from the rest of the title and address. */
    mark { color: #fff; background: none; font-weight: 500; }
    .url mark { color: #bdbdbd; font-weight: 400; }

    /* A quick search site: its icon, name and shortcut, and on the
       highlighted row, the key that turns it into the field's chip. */
    .row img { width: 16px; height: 16px; flex: 0 0 auto; object-fit: contain; }
    .site-name { flex: 1 1 0; min-width: 0; overflow: hidden; color: #ededed; white-space: nowrap; text-overflow: ellipsis; }
    .shortcut, .hint {
      flex: 0 0 auto;
      padding: 4px 6px;
      border-radius: 5px;
      font: 400 11px/1 'DM Mono', ui-monospace, monospace;
    }
    .shortcut { color: #bdbdbd; box-shadow: inset 0 0 0 1px var(--line); }
    .hint {
      color: var(--dim);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 160ms ease-out, transform 240ms var(--settle);
    }
    .row.is-selected .hint { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="menu" id="menu" role="listbox" aria-label="Suggestions"></div>
  <template id="row-template">
    <div class="row" role="option" aria-selected="false">
      <span class="kind"></span>
      <span class="title"></span>
      <span class="url"></span>
    </div>
  </template>
  <!-- A clock for a visited page, a star for a bookmark. -->
  <template id="history-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path>
    </svg>
  </template>
  <template id="bookmark-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 2.5 2.9 6.1 6.6.9-4.8 4.6 1.2 6.6-5.9-3.2-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"></path>
    </svg>
  </template>

  <template id="site-template">
    <div class="row" role="option" aria-selected="false">
      <img alt="">
      <span class="site-name"></span>
      <span class="hint" aria-hidden="true">Tab to search</span>
      <span class="shortcut"></span>
    </div>
  </template>

  <script>
    const menu = document.getElementById('menu')
    const rowTemplate = document.getElementById('row-template')
    const historyIcon = document.getElementById('history-icon')
    const bookmarkIcon = document.getElementById('bookmark-icon')
    const siteTemplate = document.getElementById('site-template')

    // How the address bar shows an address: without its scheme and www.
    const bare = (url) => url.replace(/^https?:\/\/(www\.)?/, '')

    // `text` with each of the words typed in it marked.
    function marked(text, words) {
      if (!words.length) return [text]
      const pattern = new RegExp(`(${words.join('|')})`, 'giu')
      // Splitting on a group puts what matched at the odd places.
      return text.split(pattern).map((part, i) => {
        if (i % 2 === 0) return part
        const mark = document.createElement('mark')
        mark.textContent = part
        return mark
      })
    }

    // Which list main last showed; a click names it.
    let generation = 0
    function draw(list) {
      generation = list.generation
      const items = list.items
      // As history.js matches them: every word, an address without its
      // scheme and www.; longest first, so a longer one is marked whole.
      const words = bare(list.text.trim()).split(/\s+/).filter(Boolean)
        .sort((a, b) => b.length - a.length).map((word) => RegExp.escape(word))
      menu.replaceChildren(...items.map((item, index) => {
        let row
        if (item.kind === 'site') {
          row = siteTemplate.content.firstElementChild.cloneNode(true)
          row.querySelector('img').src = item.icon
          row.querySelector('.site-name').textContent = item.name
          row.querySelector('.shortcut').textContent = item.shortcut
          row.setAttribute('aria-label', `Search ${item.name}, ${item.shortcut}`)
        } else {
          row = rowTemplate.content.firstElementChild.cloneNode(true)
          row.querySelector('.kind').replaceWith((item.bookmarked ? bookmarkIcon : historyIcon).content.cloneNode(true))
          if (item.bookmarked) row.setAttribute('aria-description', 'Bookmark')
          row.querySelector('.title').replaceChildren(...marked(item.title || bare(item.url), words))
          row.querySelector('.url').replaceChildren(...(item.title ? marked(bare(item.url), words) : []))
        }
        // Picked on press: the address field closes the list as it loses
        // focus to this click, and the list only lasts while it fades out.
        row.addEventListener('mousedown', (event) => {
          if (event.button === 0) window.lit.suggestions.pick(index, generation)
        })
        return row
      }))
      // Opens from its closed state, so it eases in each time it appears.
      if (!menu.classList.contains('is-open')) requestAnimationFrame(() => menu.classList.add('is-open'))
    }

    function select(index) {
      for (const [i, row] of [...menu.children].entries()) {
        row.classList.toggle('is-selected', i === index)
        row.setAttribute('aria-selected', String(i === index))
        if (i === index) row.scrollIntoView({ block: 'nearest' })
      }
    }

    window.lit.suggestions.onShow(draw)
    window.lit.suggestions.onSelect(select)
    window.lit.suggestions.onHide(() => menu.classList.remove('is-open'))
  </script>
</body>
</html>
