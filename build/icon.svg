<!-- Source for build/icon.png: a small white-hot flame whose glow lights the tile.
     Re-render to a 1024×1024 PNG after editing (see README, App icon). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <path id="flame" d="M50 20 C52 34 68 44 68 60 C68 70 60 78 50 78 C40 78 32 70 32 60 C32 44 48 34 50 20 Z"/>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2c"/><stop offset="1" stop-color="#0c0c0d"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
    <radialGradient id="cast" cx="50%" cy="68%" r="58%"><stop offset="0" stop-color="#ff7a2a" stop-opacity=".3"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient>
    <!-- Red tip, through orange and gold, to a white base. -->
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3a1a"/><stop offset=".38" stop-color="#ff8a2a"/><stop offset=".72" stop-color="#ffd27a"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <radialGradient id="heart" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <!-- Tile: shadow, gradient, top-lit rim, and the flame's warm light on it. -->
  <rect x="11" y="12" width="78" height="80" rx="18" fill="#000" opacity=".35" filter="url(#shade)"/>
  <rect x="10" y="10" width="80" height="80" rx="18" fill="url(#tile)"/>
  <rect x="10.25" y="10.25" width="79.5" height="79.5" rx="17.75" fill="none" stroke="url(#rim)" stroke-width=".5"/>
  <rect x="10" y="10" width="80" height="80" rx="18" fill="url(#cast)"/>
  <!-- Flame at 62% size: a blurred copy for the glow, the flame, then its white heart. -->
  <g transform="translate(50 50) scale(.62) translate(-50 -50)">
    <use href="#flame" fill="#ff5a1f" opacity=".85" filter="url(#glow)"/>
    <use href="#flame" fill="url(#fire)"/>
    <ellipse cx="50" cy="66" rx="12" ry="11" fill="url(#heart)"/>
  </g>
</svg>
